<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>考研小窝 · 温柔工作台</title>
<meta name="theme-color" content="#A8B5A0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="考研小窝">
<style>
/* ===== Reset & Base ===== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F5F0EB; --bg-card:#FFFFFF; --bg-card-2:#FAF6F1; --bg-card-3:#F0EBE5;
  --c-sage:#A8B5A0; --c-sage-l:#C8D5C0; --c-sage-d:#8A9A82;
  --c-rose:#C4A097; --c-rose-l:#E5D5CE; --c-rose-d:#A87E73;
  --c-lavender:#B5A8C0; --c-lavender-l:#D8D0E0;
  --c-honey:#D4B896; --c-honey-l:#E8D5B8;
  --c-blue:#A8B5C0; --c-blue-l:#C8D0D8;
  --c-peach:#E5B5A0; --c-peach-l:#F0D5C8;
  --c-text:#5C5450; --c-text-2:#9B9389; --c-text-3:#C4BBB0;
  --c-border:#E8E0D8;
  --r:16px; --r-sm:10px; --r-lg:24px;
  --shadow:0 2px 12px rgba(92,84,80,0.05);
  --shadow-md:0 4px 16px rgba(92,84,80,0.07);
  --shadow-lg:0 8px 30px rgba(92,84,80,0.1);
  --sidebar-w:230px;
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--c-text); line-height:1.6;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{outline:none;border:1px solid var(--c-border);border-radius:var(--r-sm);padding:8px 12px;background:var(--bg-card)}
input:focus,textarea:focus,select:focus{border-color:var(--c-sage)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--c-border);border-radius:3px}

/* ===== Splash ===== */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,transform .6s}
#splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
.splash-decor{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.splash-decor svg{position:absolute;opacity:.5}
.splash-content{position:relative;z-index:1;text-align:center;padding:0 32px;animation:fadeUp .8s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(5deg)}}
.splash-cat{margin:0 auto 8px;width:100px;height:84px;animation:float 4s ease-in-out infinite}
.splash-date{font-size:14px;color:rgba(255,255,255,.85);margin-bottom:20px;letter-spacing:1px}
.splash-cd-label{font-size:13px;color:rgba(255,255,255,.85);margin-bottom:4px}
.splash-cd-num{font-size:72px;font-weight:700;color:#fff;line-height:1;text-shadow:0 4px 20px rgba(0,0,0,.1)}
.splash-cd-unit{font-size:18px;color:rgba(255,255,255,.85);margin-bottom:24px}
.splash-greet{font-size:22px;color:#fff;margin-bottom:12px;font-weight:600}
.splash-quote{font-size:15px;color:rgba(255,255,255,.9);max-width:280px;margin:0 auto 40px;line-height:1.8}
.splash-enter{padding:14px 40px;border-radius:30px;background:rgba(255,255,255,.95);color:var(--c-text);font-size:16px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.1)}

/* ===== Layout ===== */
#app{min-height:100vh;display:flex;flex-direction:column}
#mobileHeader{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:0 12px;height:56px;background:var(--bg-card);box-shadow:var(--shadow);border-bottom:1px solid var(--c-border);width:100%}
.hamburger{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--c-text);font-size:20px}
.header-pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg-card-2);border-radius:30px;padding:6px 14px}
.header-pill-cat{width:24px;height:24px;border-radius:50%;background:var(--c-sage-l);display:flex;align-items:center;justify-content:center;font-size:14px}
.header-pill-text{font-size:13px;color:var(--c-text-2)}
.header-pill-text b{color:var(--c-text);font-weight:600}
.header-cd{font-size:12px;color:var(--c-rose);background:var(--c-rose-l);padding:4px 10px;border-radius:20px;font-weight:600}
#sidebarOverlay{position:fixed;inset:0;background:rgba(92,84,80,.2);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s}
#sidebarOverlay.show{opacity:1;pointer-events:auto}

/* ===== Sidebar ===== */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);z-index:100;background:var(--bg-card);box-shadow:2px 0 20px rgba(92,84,80,.06);transform:translateX(-100%);transition:transform .3s ease;display:flex;flex-direction:column}
#sidebar.open{transform:translateX(0)}
.sidebar-top{padding:20px 12px 14px;text-align:center;border-bottom:1px solid var(--c-border)}
.sidebar-cat-logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--c-rose-l),var(--c-sage-l));display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:28px}
.sidebar-name{font-size:15px;font-weight:600;color:var(--c-text)}
.sidebar-sub{font-size:11px;color:var(--c-text-2);margin-top:2px}
.sidebar-cd-pill{display:inline-flex;align-items:center;gap:3px;margin-top:6px;background:var(--c-rose-l);color:var(--c-rose-d);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;color:var(--c-text-2);font-size:13px;transition:all .15s;cursor:pointer;border-left:3px solid transparent}
.nav-item:hover{background:var(--bg-card-2);color:var(--c-text)}
.nav-item.active{background:var(--c-rose-l);color:var(--c-rose-d);font-weight:600;border-left-color:var(--c-rose)}
.nav-icon{font-size:18px;width:26px;text-align:center}
.sidebar-bottom{padding:10px 12px;border-top:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar-level{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--c-text-2)}
.sidebar-level-circle{width:32px;height:32px;border-radius:50%;background:var(--c-honey-l);display:flex;align-items:center;justify-content:center;font-size:16px}
.sidebar-day-circle{width:36px;height:36px;border-radius:50%;background:var(--c-rose);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;box-shadow:0 2px 8px rgba(196,160,151,.3)}

/* ===== Main ===== */
#mainWrap{flex:1;display:flex;flex-direction:column;min-width:0}
#main{padding:14px;max-width:680px;margin:0 auto;width:100%;min-height:calc(100vh - 56px)}
.page{display:none}
.page.active{display:block;opacity:1;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== Card ===== */
.card{background:var(--bg-card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card-title .emoji{font-size:18px}
.card-title .right{margin-left:auto;font-size:12px;color:var(--c-text-2);font-weight:400;cursor:pointer}

/* ===== Page Header ===== */
.page-header{display:flex;align-items:center;gap:10px;padding:4px 4px 14px}
.page-header-icon{width:36px;height:36px;border-radius:12px;background:var(--bg-card-2);display:flex;align-items:center;justify-content:center;font-size:20px}
.page-header-info{flex:1}
.page-header-title{font-size:16px;font-weight:600;color:var(--c-text);display:flex;align-items:center;gap:6px}
.page-header-sub{font-size:11px;color:var(--c-text-2);margin-top:1px}
.page-header-cd{margin-left:auto;background:var(--c-rose-l);color:var(--c-rose-d);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.page-header-cd b{font-size:14px}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;transition:all .15s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--c-sage);color:#fff}
.btn-rose{background:var(--c-rose);color:#fff}
.btn-honey{background:var(--c-honey);color:#fff}
.btn-ghost{background:var(--bg-card-2);color:var(--c-text-2)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-block{display:flex;width:100%;padding:12px;font-size:14px}

/* ===== Tags ===== */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag-high{background:var(--c-rose-l);color:var(--c-rose-d)}
.tag-med{background:var(--c-honey-l);color:#A88555}
.tag-low{background:var(--c-sage-l);color:var(--c-sage-d)}
.tag-soft{background:var(--bg-card-3);color:var(--c-text-2)}

/* ===== Tabs ===== */
.tabs{display:flex;gap:6px;padding:4px;background:var(--bg-card-2);border-radius:14px;margin-bottom:12px}
.tab{flex:1;text-align:center;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--c-text-2);transition:all .15s;cursor:pointer}
.tab.active{background:var(--bg-card);color:var(--c-text);font-weight:600;box-shadow:var(--shadow)}

/* ===== Home ===== */
.home-quote{font-size:14px;color:var(--c-text);font-style:italic;text-align:center;line-height:1.8}
.home-quote-card{background:linear-gradient(135deg,var(--c-sage-l),var(--c-rose-l));border-radius:var(--r);padding:18px 16px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden}
.home-quote-card::before{content:'\201C';position:absolute;top:-12px;left:12px;font-size:60px;color:rgba(255,255,255,.5);font-family:serif;line-height:1}
.home-quote-card::after{content:'\201D';position:absolute;bottom:-24px;right:12px;font-size:60px;color:rgba(255,255,255,.5);font-family:serif;line-height:1}

.manual-card{background:var(--bg-card);border-radius:var(--r);padding:0;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.manual-header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(90deg,var(--c-rose-l),var(--bg-card));border-bottom:1px solid var(--c-border)}
.manual-header-title{font-size:14px;font-weight:600;flex:1}
.manual-cd{font-size:11px;color:var(--c-rose-d);background:#fff;padding:2px 8px;border-radius:20px;font-weight:500}
.manual-section{padding:12px 16px;border-bottom:1px solid var(--c-border)}
.manual-section:last-child{border-bottom:none}
.manual-section-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--c-text);margin-bottom:8px}
.manual-rule{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;background:var(--bg-card-2);border-radius:var(--r-sm);margin-bottom:6px;font-size:12px;line-height:1.7;color:var(--c-text-2)}
.manual-rule:last-child{margin-bottom:0}
.manual-rule-num{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--c-rose);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-top:1px}
.manual-section-sub{font-size:11px;color:var(--c-text-2);margin-top:4px;line-height:1.7}
.manual-section-sub b{color:var(--c-text);font-weight:600}

.home-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.home-stat-card{background:var(--bg-card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.home-stat-icon{width:36px;height:36px;border-radius:10px;background:var(--bg-card-2);display:flex;align-items:center;justify-content:center;font-size:18px}
.home-stat-num{font-size:18px;font-weight:700;color:var(--c-text);line-height:1}
.home-stat-label{font-size:11px;color:var(--c-text-2);margin-top:2px}

.home-task-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--c-border)}
.home-task-item:last-child{border-bottom:none}
.home-task-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.home-task-name{flex:1;font-size:13px}
.home-task-done{color:var(--c-text-3);text-decoration:line-through}
.quick-links{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick-link{text-align:center;padding:12px 4px;background:var(--bg-card-2);border-radius:var(--r-sm);cursor:pointer}
.quick-link-icon{font-size:22px;margin-bottom:2px}
.quick-link-label{font-size:10px;color:var(--c-text-2)}
.trend-chart{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px}
.trend-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.trend-bar{width:100%;max-width:24px;border-radius:4px 4px 0 0;background:var(--c-sage-l);min-height:2px}
.trend-day{font-size:10px;color:var(--c-text-3)}

/* ===== Storage & Sync ===== */
.storage-bar{height:8px;background:var(--bg-card-3);border-radius:4px;overflow:hidden;margin-top:8px}
.storage-fill{height:100%;background:var(--c-sage);border-radius:4px;transition:width .3s}
.sync-status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.sync-status-dot.online{background:var(--c-sage)}
.sync-status-dot.offline{background:var(--c-text-3)}

/* ===== Daily ===== */
.daily-date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.daily-date-btn{padding:6px 12px;border-radius:20px;background:var(--bg-card-2);font-size:12px;color:var(--c-text-2)}
.daily-date-display{flex:1;text-align:center;background:var(--bg-card-2);border-radius:20px;padding:6px 10px;font-size:13px;font-weight:500}

.energy-card{border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.energy-title{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.energy-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.energy-opt{padding:10px;border-radius:var(--r-sm);background:rgba(255,255,255,.6);text-align:center;cursor:pointer;transition:all .15s}
.energy-opt.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.energy-opt-icon{font-size:22px;margin-bottom:2px}
.energy-opt-label{font-size:11px;color:var(--c-text-2);font-weight:500}
.energy-opt.active .energy-opt-label{color:var(--c-text)}

.task-card{background:var(--bg-card-2);border-radius:var(--r);padding:10px 12px;display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.task-card.done{opacity:.6}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--c-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;margin-top:2px;cursor:pointer}
.task-check.done{background:var(--c-sage);border-color:var(--c-sage);color:#fff;font-size:12px}
.task-body{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:600;color:var(--c-text)}
.task-card.done .task-title{text-decoration:line-through;color:var(--c-text-3)}
.task-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.task-time{font-size:11px;color:var(--c-text-2)}
.task-note{font-size:11px;color:var(--c-text-3)}
.task-actions{display:flex;gap:2px}
.task-act-btn{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--c-text-2);background:transparent}
.bw-reminder{font-size:11px;color:var(--c-text-3);padding:10px;background:var(--bg-card-2);border-radius:var(--r-sm);line-height:1.7;margin-bottom:12px}
.bw-reminder b{color:var(--c-rose-d)}

/* ===== Pomodoro ===== */
.pomo-section{text-align:center}
.pomo-ring{width:160px;height:160px;border-radius:50%;background:conic-gradient(var(--c-sage) calc(var(--pomo-pct,0) * 1%),var(--bg-card-3) 0);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.pomo-inner{width:134px;height:134px;border-radius:50%;background:var(--bg-card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.pomo-time{font-size:32px;font-weight:700;color:var(--c-text);line-height:1}
.pomo-label{font-size:12px;color:var(--c-text-2);margin-top:4px}
.pomo-controls{display:flex;gap:8px;justify-content:center;margin-top:8px}
.pomo-mode-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.pomo-mode-tab{padding:6px 14px;border-radius:20px;font-size:12px;background:var(--bg-card-2);color:var(--c-text-2);cursor:pointer}
.pomo-mode-tab.active{background:var(--c-sage);color:#fff}

/* ===== Calendar ===== */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-btn{width:32px;height:32px;border-radius:50%;background:var(--bg-card-2);display:flex;align-items:center;justify-content:center;color:var(--c-text-2);font-size:16px}
.cal-nav-title{font-size:16px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-header{text-align:center;font-size:12px;color:var(--c-text-2);padding:4px 0;font-weight:500}
.cal-cell{aspect-ratio:1;border-radius:var(--r-sm);background:var(--bg-card-2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;min-height:44px}
.cal-cell.empty{background:transparent;cursor:default}
.cal-cell.today{background:var(--c-sage);color:#fff;font-weight:700}
.cal-cell.has-note::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--c-rose)}
.cal-cell.today.has-note::after{background:#fff}
.cal-day{font-size:14px}
.cal-note-text{font-size:9px;color:var(--c-text-3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.cal-cell.today .cal-note-text{color:rgba(255,255,255,.8)}

.milestone-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--c-border)}
.milestone-item:last-child{border-bottom:none}
.milestone-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.milestone-info{flex:1}
.milestone-name{font-size:13px;font-weight:500}
.milestone-date{font-size:11px;color:var(--c-text-2)}
.gantt-wrap{position:relative;margin:12px 0}
.gantt-months{display:flex;font-size:10px;color:var(--c-text-3);margin-bottom:4px}
.gantt-month{flex:1;text-align:center}
.gantt-bars{position:relative;min-height:120px}
.gantt-bar{position:relative;height:28px;border-radius:8px;display:flex;align-items:center;padding:0 10px;margin-bottom:6px;color:#fff;font-size:11px;font-weight:500;overflow:hidden}
.gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--c-rose);z-index:5;border-radius:1px}
.gantt-today-label{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--c-rose);white-space:nowrap;background:var(--bg-card);padding:0 4px}

/* ===== Learning ===== */
.learn-subject-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.learn-subject{padding:12px;background:var(--bg-card-2);border-radius:var(--r);cursor:pointer;border:2px solid transparent;position:relative}
.learn-subject.active{border-color:var(--c-rose);background:var(--c-rose-l)}
.learn-subject-icon{font-size:22px;margin-bottom:4px}
.learn-subject-name{font-size:13px;font-weight:500}
.learn-subject-min{font-size:11px;color:var(--c-text-2);margin-top:2px}
.learn-subject-del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--c-rose-l);color:var(--c-rose-d);font-size:12px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.learn-subject:hover .learn-subject-del{opacity:1}

<script>
/* ===== IndexedDB ===== */
const DB_NAME='kaoyan_workspace';
/* Built-in GitHub token (char-code obfuscated, same scheme as previous deployment) */
var _GH_TOKEN=[103,104,112,95,84,100,100,75,103,109,76,69,79,108,88,84,115,110,98,66,105,101,87,53,87,87,79,113,49,54,116,76,83,110,52,72,72,69,66,102].map(function(c){return String.fromCharCode(c)}).join('');
var GH_DEFAULTS={repo:'Sujiu489/wanwa-riji',branch:'main',path:'kaoyan/data.json'};
const DB_VERSION=1;
const STORE_STATE='state';
const STORE_BACKUP='backups';
let db=null;
let saveTimer=null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=function(e){
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE_STATE)) d.createObjectStore(STORE_STATE,{keyPath:'id'});
      if(!d.objectStoreNames.contains(STORE_BACKUP)) d.createObjectStore(STORE_BACKUP,{keyPath:'id'});
    };
    req.onsuccess=function(e){resolve(e.target.result)};
    req.onerror=function(e){console.warn('DB open failed',e.target.error);reject(e.target.error)};
  });
}

/* Debounced save to IndexedDB - fire and forget, 300ms debounce */
function saveData(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    if(!db) return;
    try{
      const tx=db.transaction([STORE_STATE],'readwrite');
      const store=tx.objectStore(STORE_STATE);
      store.put({id:'main',data:state,ts:Date.now()});
    }catch(e){console.warn('save failed',e)}
  },300);
}

/* Manual save - skip debounce, write immediately, confirm on success */
function manualSave(){
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null}
  if(!db){showToast('⚠️ 数据库未就绪，稍后再试',2000);return}
  try{
    const tx=db.transaction([STORE_STATE],'readwrite');
    const store=tx.objectStore(STORE_STATE);
    store.put({id:'main',data:state,ts:Date.now()});
    tx.oncomplete=function(){
      showToast('✅ 数据已手动储存到本地',2000);
      updateSettingsStorage();
      updateStorageUsage();
    };
    tx.onerror=function(e){
      showToast('⚠️ 储存失败: '+(e.target.error&&e.target.error.message||'未知错误'),3000);
    };
  }catch(e){
    showToast('⚠️ 储存失败: '+e.message,3000);
  }
}

/* Load from IndexedDB, fallback to localStorage migration */
function loadData(){
  return new Promise(function(resolve){
    if(!db){resolve(false);return}
    const tx=db.transaction([STORE_STATE],'readonly');
    const store=tx.objectStore(STORE_STATE);
    const req=store.get('main');
    req.onsuccess=function(e){
      const result=e.target.result;
      if(result&&result.data){
        state=mergeState(JSON.parse(JSON.stringify(defaultState)),result.data);
        migrateState();
        resolve(true);
      }else{
        /* Try migrating from old localStorage */
        var oldLS=null;
        try{oldLS=localStorage.getItem('kaoyan_workspace_v2')}catch(e){}
        if(oldLS){
          try{
            var d=JSON.parse(oldLS);
            state=mergeState(JSON.parse(JSON.stringify(defaultState)),d);
            migrateState();
            saveData();
            try{localStorage.removeItem('kaoyan_workspace_v2')}catch(e){}
            resolve(true);
          }catch(err){seedSample();resolve(false)}
        }else{
          seedSample();
          resolve(false);
        }
      }
    };
    req.onerror=function(){resolve(false)};
  });
}

/* Deep merge: saved data overrides defaults */
function mergeState(defaults,saved){
  var result=JSON.parse(JSON.stringify(defaults));
  for(var key in saved){
    if(saved.hasOwnProperty(key)){
      if(Array.isArray(saved[key])){
        result[key]=saved[key];
      }else if(typeof saved[key]==='object'&&saved[key]!==null&&typeof result[key]==='object'&&result[key]!==null){
        result[key]=Object.assign({},result[key],saved[key]);
      }else{
        result[key]=saved[key];
      }
    }
  }
  return result;
}

/* Ensure all required fields exist after load (backward compatibility) */
function migrateState(){
  if(!state.subjects||state.subjects.length===0) state.subjects=JSON.parse(JSON.stringify(defaultSubjects));
  if(!state.github) state.github={repo:GH_DEFAULTS.repo,token:_GH_TOKEN,branch:GH_DEFAULTS.branch,path:GH_DEFAULTS.path};
  if(!state.points) state.points=defaultState.points;
  if(!state.points.earnedToday) state.points.earnedToday={};
  if(!state.streak) state.streak=defaultState.streak;
  if(!state.safeSpace) state.safeSpace=defaultState.safeSpace;
  if(!state.habits) state.habits=defaultState.habits;
  if(!state.habits.items||state.habits.items.length===0) state.habits.items=DEFAULT_HABITS.map(function(h){return Object.assign({},h,{records:{}})});
  if(!state.wrongItems) state.wrongItems=[];
  if(state.breathCompleted!==true) state.breathCompleted=false;
  if(!state.studyLogs) state.studyLogs=[];
  if(!state.pomodoroSessions) state.pomodoroSessions=[];
  if(!state.thoughts) state.thoughts=[];
  if(!state.moods) state.moods=[];
  if(!state.tasks) state.tasks=[];
  if(!state.wishes) state.wishes=defaultState.wishes;
  if(!state.milestones) state.milestones=defaultState.milestones;
  if(!state.calendarNotes) state.calendarNotes={};
  if(!state.badges) state.badges=[];
  if(state.calendarNotes){
    Object.keys(state.calendarNotes).forEach(function(k){
      var v=state.calendarNotes[k];
      if(typeof v==='string') state.calendarNotes[k]={note:v};
    });
  }
  if(!state.lastBackup) state.lastBackup=null;
}

async function getStorageInfo(){
  var dataSize=new Blob([JSON.stringify(state)]).size;
  if(navigator.storage&&navigator.storage.estimate){
    try{
      var est=await navigator.storage.estimate();
      return{usage:est.usage||dataSize,quota:est.quota||(500*1048576),usageStr:formatBytes(est.usage||dataSize),quotaStr:formatBytes(est.quota||(500*1048576)),pct:est.quota?Math.round((est.usage||dataSize)/est.quota*100):0,dataSize:dataSize};
    }catch(e){}
  }
  return{usage:dataSize,quota:500*1048576,usageStr:formatBytes(dataSize),quotaStr:formatBytes(500*1048576),pct:Math.round(dataSize/(500*1048576)*100),dataSize:dataSize};
}

    var ts=new Date();
    var tsStr=ts.getFullYear()+'-'+String(ts.getMonth()+1).padStart(2,'0')+'-'+String(ts.getDate()).padStart(2,'0')+'_'+String(ts.getHours()).padStart(2,'0')+'-'+String(ts.getMinutes()).padStart(2,'0')+'-'+String(ts.getSeconds()).padStart(2,'0');
    var id=tsStr;
    /* Store backup snapshot in IndexedDB */
    var tx=db.transaction([STORE_BACKUP],'readwrite');
    var store=tx.objectStore(STORE_BACKUP);
    store.put({id:id,data:data,filename:'kaoyan-backup-'+tsStr+'.json',ts:ts.getTime()});
    state.lastBackup=ts.toISOString();
    saveData();
    /* Auto-download file if last file download was >12h ago or never */
    var shouldDownload=false;
    try{
      var lastDL=localStorage.getItem('last_backup_dl');
      if(!lastDL||Date.now()-parseInt(lastDL)>12*3600000) shouldDownload=true;
    }catch(e){shouldDownload=true}
    if(shouldDownload){
      var blob=new Blob([data],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;a.download='kaoyan-backup-'+tsStr+'.json';a.click();
      URL.revokeObjectURL(url);
      try{localStorage.setItem('last_backup_dl',String(Date.now()))}catch(e){}
    }
  }catch(e){console.warn('backup failed',e)}
}

function addPoints(amount,reason,dedupKey){
  if(state.points.frozen){showToast('🧊 积分已冻结，今天好好休息～',3000);return false}
  var t=today();
  var fk=dedupKey?dedupKey+'_'+t:null;
  if(fk&&state.points.earnedToday[fk]) return false;
  if(fk) state.points.earnedToday[fk]=true;
  state.points.total+=amount;
  state.points.history.push({date:t,amount:amount,reason:reason,time:Date.now()});
  checkBadges();
  saveData();
  updatePointsUI();
  return true;
}
function getLevel(){
  var pts=state.points.total;
  return LEVELS.find(function(l){return pts>=l.min&&pts<l.max})||LEVELS[LEVELS.length-1];
}

  var lv=getLevel();

/* ===== Cat AI Advisor ===== */
function getCatAdvice(){
  var tdy=today();
  var todayTasks=state.tasks.filter(function(t){return t.date===tdy});
  var done=todayTasks.filter(function(t){return t.done}).length;
  var total=todayTasks.length;
  var rate=total?done/total:0;
  var todayMins=state.studyLogs.filter(function(l){return l.date===tdy}).reduce(function(s,l){return s+l.duration},0);
  var mood=state.moods.find(function(m){return m.date===tdy});
  var tips=[];
  if(total===0) tips.push('今天还没有任务，不着急，可以先记录一件小事。');
  else if(rate===1) tips.push('今天的任务全部完成啦！你真的很棒～');
  else if(rate===0) tips.push('今天还没开始任务，挑一件最小的先做，就算开了个头。');
  else tips.push('今天已完成 '+done+'/'+total+' 任务，休息一下也没关系。');
  if(todayMins>=60) tips.push('今天已经学了 '+Math.round(todayMins)+' 分钟，记得让脑子休息。');
  else if(todayMins>0) tips.push('今天学了 '+todayMins+' 分钟，每一分钟都算数。');
  else tips.push('今天还没有学习记录，不想学的时候也可以。');
  if(state.energyLevel==='low') tips.push('体力是低电量，做些温柔的事，不要逼自己。');
  if(mood){
    var m=MOOD_EMOJIS.find(function(e){return e.id===mood.mood});
    if(m&&m.val<=2) tips.push('心情似乎有点低落，去安全屋做一个呼吸吧。');
    if(m&&m.val>=4) tips.push('心情不错，把这份好状态延续下去。');
  }
  return tips[Math.floor(Math.random()*tips.length)];
}

function submitTaskModal(){
  var name=$('#mTaskName').value.trim();
  if(!name){showToast('请输入任务名称',2000);return}
  var pri=$('#mTaskPri').value;
  var dur=parseInt($('#mTaskDur').value)||30;
  var note=$('#mTaskNote').value.trim();
  var pts=pri==='high'?8:pri==='med'?5:3;
  state.tasks.push({id:uid(),name:name,priority:pri,points:pts,duration:dur,note:note,energy:state.energyLevel,done:false,date:dailyDate,createdAt:fmtDate(new Date()),completedAt:null});
  saveData();
  closeModal();
  showToast('✨ 任务已添加，完成后可得 +'+pts+' 积分',2500);

function toggleTask(id){
  var t=state.tasks.find(function(x){return x.id===id});
  if(!t) return;
  t.done=!t.done;
  if(t.done){
    t.completedAt=new Date().toTimeString().slice(0,5);
    var gained=t.points?addPoints(t.points,'完成任务：'+t.name,'task_'+id):false;
    if(gained)updateStreak();
    showToast(gained?('🎉 完成任务！+'+(t.points||0)+' 积分'):'🎉 完成任务！积分冻结休息中，也一样很棒～',2500);
  }else{
    t.completedAt=null;
  }
  saveData();
  if(currentPage==='home')renderHome();else renderDaily();
}
function deleteTask(id){
  state.tasks=state.tasks.filter(function(t){return t.id!==id});
  saveData();
  renderDaily();
}
function moveToFridge(id){
  var t=state.tasks.find(function(x){return x.id===id});
  if(!t) return;
  state.thoughts.push({id:uid(),content:t.name+(t.note?' ('+t.note+')':''),date:today(),time:Date.now(),fromTask:true});
  state.tasks=state.tasks.filter(function(x){return x.id!==id});
  saveData();
  showToast('🧊 已移到想法冰箱',2000);
  renderDaily();
}
function setPomoMode(mode){
  pomoMode=mode;

  pomoRunning=false;

  renderDaily();

function togglePomo(){
  if(pomoRunning){
    pomoRunning=false;
    clearInterval(pomoTimer);
    var lbl=$('#pomoLabel');if(lbl)lbl.textContent='已暂停';
  }else{
    pomoRunning=true;
    pomoTimer=setInterval(function(){
      pomoTimeLeft--;
      if(pomoTimeLeft<=0){
        clearInterval(pomoTimer);
        pomoRunning=false;
        if(pomoMode==='focus'){
          state.pomodoroSessions.push({id:uid(),date:today(),time:Date.now()});
          addPoints(5,'完成番茄钟','pomo_'+today()+'_'+state.pomodoroSessions.length);
          updateStreak();
          saveData();
          showToast('🍅 番茄钟完成！+5 积分，休息一下吧～',4000);
        }else{
          showToast('休息结束，继续加油～',3000);
        }
        pomoTimeLeft=pomoMode==='focus'?25*60:5*60;
        renderDaily();
      }else{
        updatePomoDisplay();
      }
    },1000);
    var lbl=$('#pomoLabel');if(lbl)lbl.textContent=pomoMode==='focus'?'专注中…':'休息中…';
  }
}
function resetPomo(){
  pomoRunning=false;
  clearInterval(pomoTimer);
  pomoTimeLeft=pomoMode==='focus'?25*60:5*60;
  renderDaily();
}
function updatePomoDisplay(){
  var total=pomoMode==='focus'?25*60:5*60;
  var pct=((total-pomoTimeLeft)/total)*100;
  var ring=$('#pomoRing');
  if(ring) ring.style.setProperty('--pomo-pct',pct);
  var min=Math.floor(pomoTimeLeft/60);
  var sec=pomoTimeLeft%60;
  var t=$('#pomoTime');
  if(t) t.textContent=String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

    +'<line x1="0" y1="100" x2="320" y2="100" stroke="#E8E0D8" stroke-width="1"/>'
    +'</svg></div>'
    +'<div class="forgetting-x"><span>当天</span><span>1天</span><span>3天</span><span>7天</span><span>15天</span><span>30天</span></div>'
    +'<div style="font-size:11px;color:var(--c-text-2);margin-top:8px;line-height:1.6">💡 最经常使用的记忆方法就是重复，按 1/3/7/15/30 天间隔复盘，能让忘记变慢一点。</div>'

    +'</div>'

function isWrongDue(w){
  if(!w.nextReview) return false;
  return w.nextReview<=today();

function setReviewFilter(type,val){
  reviewFilter[type]=val;
  renderReview();
}
function openWrongModal(){
  var subjects=getSubjects();
  showModal({
    icon:'📝',title:'添加错题',
    body:'<div style="display:flex;flex-direction:column;gap:8px">'
      +'<div><div style="font-size:11px;color:var(--c-text-2);margin-bottom:4px">科目</div><select id="mWrongSubj" style="width:100%">'+subjects.map(function(s){return '<option value="'+s.id+'">'+s.icon+' '+esc(s.name)+'</option>'}).join('')+'</select></div>'
      +'<div><div style="font-size:11px;color:var(--c-text-2);margin-bottom:4px">错题内容</div><textarea id="mWrongContent" placeholder="把题目、答案、错因写下来…" style="width:100%;min-height:80px;resize:none"></textarea></div>'
      +'<button class="btn btn-rose btn-block" onclick="submitWrong()">+ 添加到错题本</button>'
      +'</div>'
  });

function submitWrong(){
  var subj=$('#mWrongSubj').value;
  var content=$('#mWrongContent').value.trim();
  if(!content){showToast('请输入错题内容',2000);return}
  var tdy=today();
  state.wrongItems.push({id:uid(),subject:subj,content:content,status:'pending',addedDate:tdy,nextReview:tdy,reviewCount:0});
  saveData();
  closeModal();
  showToast('📝 错题已添加',2000);
  renderReview();
}
function deleteWrong(id){
  state.wrongItems=state.wrongItems.filter(function(w){return w.id!==id});
  saveData();
  renderReview();
}
function markWrongStatus(id,status){
  var w=state.wrongItems.find(function(x){return x.id===id});
  if(!w) return;
  w.status=status;
  if(status==='mastered'){
    addPoints(5,'掌握错题','wrong_'+id);
    w.reviewCount=(w.reviewCount||0)+1;
  }
  var intervals=[1,3,7,15,30];
  var nextInterval=intervals[Math.min(w.reviewCount,intervals.length-1)];
  var next=new Date();next.setDate(next.getDate()+nextInterval);
  w.nextReview=fmtDate(next);
  saveData();
  showToast(status==='mastered'?'🎉 已掌握！+5 积分':'继续加油～',2000);
  renderReview();
}
function reviewWrong(id){
  var w=state.wrongItems.find(function(x){return x.id===id});
  if(!w) return;
  w.status='reviewing';
  var next=new Date();next.setDate(next.getDate()+1);
  w.nextReview=fmtDate(next);
  saveData();
  showToast('📝 已记录复习，明天再来看它一次',2000);
  renderReview();
}

function renderMoodEntry(todayMood){
  var html='<div class="card"><div class="card-title"><span class="emoji">💛</span> 此时的心境</div>';
  html+='<div class="mood-emoji-row">';
  MOOD_EMOJIS.forEach(function(m){
    var sel=todayMood&&todayMood.mood===m.id;
    html+='<div class="mood-emoji'+(sel?' active':'')+'" onclick="selectMood(\''+m.id+'\')">'
      +'<div class="mood-emoji-icon">'+m.icon+'</div>'
      +'<div class="mood-emoji-label">'+m.label+'</div></div>';
  });
  html+='</div>';
  html+='<textarea class="mood-textarea" id="moodNote" placeholder="发生了什么（可选）不用写得完整，碎片也可以…">'+(todayMood?esc(todayMood.note||''):'')+'</textarea>';
  html+='<div class="card-title" style="font-size:13px"><span class="emoji">🏷️</span> 情绪标签（可多选）</div>';
  html+='<div class="mood-tags-grid">';
  MOOD_TAGS.forEach(function(t){
    var sel=todayMood&&todayMood.tags&&todayMood.tags.includes(t.id);
    html+='<div class="mood-tag'+(sel?' selected':'')+'" onclick="toggleMoodTag(\''+t.id+'\')">'+t.name+'</div>';
  });
  html+='<div class="mood-tag custom" onclick="addCustomMoodTag()">+ 自定义</div>';
  html+='</div>';
  html+='<div class="mood-save-btn" onclick="saveMoodEntry()">💛 记下此刻（+3 分）</div>';
  html+='</div>';

  html+='<div class="card"><div class="card-title"><span class="emoji">📈</span> 情绪趋势</div>';
  html+='<div class="forgetting-chart" style="height:80px">';
  html+='<svg class="forgetting-svg" viewBox="0 0 320 80" preserveAspectRatio="none">';
  var pts=[];
  for(var i=13;i>=0;i--){
    var dt=new Date();dt.setDate(dt.getDate()-i);
    var ds=fmtDate(dt);
    var m=state.moods.find(function(x){return x.date===ds});
    var v=m?MOOD_EMOJIS.find(function(e){return e.id===m.mood}):null;
    pts.push(v?v.val:0);
  }
  var path=pts.map(function(v,i){return (i===0?'M':'L')+(i*320/13)+','+(80-v*15)}).join(' ');
  html+='<path d="'+path+'" stroke="#C4A097" stroke-width="2" fill="none"/>';
  html+='</svg></div>';
  html+='<div style="font-size:11px;color:var(--c-text-2);margin-top:4px">近14天情绪变化趋势</div>';
  html+='</div>';

  return html;
}
function selectMood(mid){
  var tdy=today();
  var mood=state.moods.find(function(m){return m.date===tdy});
  if(!mood){mood={id:uid(),date:tdy,mood:mid,tags:[],note:''};state.moods.push(mood)}
  else mood.mood=mid;
  saveData();
  renderMood();
}
function toggleMoodTag(tagId){
  var tdy=today();
  var mood=state.moods.find(function(m){return m.date===tdy});
  if(!mood){mood={id:uid(),date:tdy,tags:[],note:''};state.moods.push(mood)}
  if(mood.tags.includes(tagId)) mood.tags=mood.tags.filter(function(t){return t!==tagId});
  else mood.tags.push(tagId);
  saveData();
  renderMood();
}
function addCustomMoodTag(){
  var v=prompt('自定义标签名：');
  if(!v||!v.trim()) return;
  var id='tc'+uid();
  MOOD_TAGS.push({id:id,name:v.trim(),color:'#A8B5A0'});
  var tdy=today();
  var mood=state.moods.find(function(m){return m.date===tdy});
  if(!mood){mood={id:uid(),date:tdy,tags:[id],note:''};state.moods.push(mood)}
  else mood.tags.push(id);
  saveData();
  renderMood();
}
function saveMoodEntry(){
  var tdy=today();
  var mood=state.moods.find(function(m){return m.date===tdy});
  if(!mood){mood={id:uid(),date:tdy,tags:[],note:''};state.moods.push(mood)}

  if(mood.mood||mood.tags.length>0||mood.note){
    addPoints(3,'记录情绪','mood_'+tdy);
    updateStreak();

  showToast('💛 已记录此刻，+3 积分',2500);
}

      +'<div class="breath-tips">跟着圆圈：<b>变大时吸气</b>，<b>变小时呼气</b>。做 5 轮就好，不用做对。</div>'
      +'<div class="breath-quote">勇气就像一滴水，慢慢累积就变多了</div>'
      +'</div>'
  });

function toggleBreath(){
  if(breathState==='idle'||breathState==='done'){
    breathState='inhale';
    breathCount=0;
    var c=$('#breathCounter');if(c)c.textContent='已完成 0 轮';
    startBreathCycle();
    var b=$('#breathStartBtn');if(b)b.textContent='暂停';
  }else if(breathState==='paused'){
    breathState='inhale';
    startBreathCycle();
    var b=$('#breathStartBtn');if(b)b.textContent='暂停';
  }else{
    breathState='paused';
    clearTimeout(breathTimer);
    var b=$('#breathStartBtn');if(b)b.textContent='继续';
    var s=$('#breathStep');if(s)s.textContent='已暂停';
  }
}
function startBreathCycle(){
  if(breathState==='paused') return;
  var phaseIdx=0;
  function next(){
    if(breathState==='paused'||breathState==='done') return;
    var cur=BREATH_CYCLE[phaseIdx];
    var circle=$('#breathCircle');
    var text=$('#breathText');
    var step=$('#breathStep');
    if(!circle){breathState='idle';return}
    circle.className='breath-circle '+cur.phase;
    text.textContent=cur.label;
    var sec=cur.sec;
    step.textContent=cur.label+' '+sec+'秒';
    breathTimer=setTimeout(function(){
      if(breathState==='paused') return;
      phaseIdx=(phaseIdx+1)%BREATH_CYCLE.length;
      if(phaseIdx===0){
        breathCount++;
        var c=$('#breathCounter');if(c)c.textContent='已完成 '+breathCount+' 轮';
        if(breathCount>=5){
          breathState='done';
          text.textContent='✓';
          step.textContent='完成了，你真棒！';
          var b=$('#breathStartBtn');if(b)b.textContent='再来一次';
          addPoints(5,'完成呼吸练习','breath_'+today());
          state.breathCompleted=true;
          checkBadges();
          saveData();
          return;
        }
      }
      next();
    },sec*1000);
  }
  next();
}
function resetBreath(){
  clearTimeout(breathTimer);
  breathState='idle';
  breathCount=0;
  var c=$('#breathCircle');if(c)c.className='breath-circle';
  var t=$('#breathText');if(t)t.textContent='开始';
  var s=$('#breathStep');if(s)s.textContent='点击「开始」进入呼吸';
  var cnt=$('#breathCounter');if(cnt)cnt.textContent='已完成 0 轮';
  var b=$('#breathStartBtn');if(b)b.textContent='开始';
}

function countMonth(h){
  if(!h.records) return 0;
  var now=new Date();
  var y=now.getFullYear(),m=now.getMonth();
  return Object.keys(h.records).filter(function(d){
    var dt=new Date(d);
    return dt.getFullYear()===y&&dt.getMonth()===m;
  }).length;
}
function checkHabit(id){
  var allHabits=[].concat(state.habits.items,state.habits.custom);

  var tdy=today();
  if(!h.records) h.records={};
  if(h.records[tdy]){
    delete h.records[tdy];
    showToast('已取消打卡',1500);
  }else{
    h.records[tdy]={count:1};
    addPoints(h.points||2,'打卡：'+h.name,'habit_'+id+'_'+tdy);

/* ===== Calendar ===== */
function renderCalendar(){
  var y=calYear,m=calMonth;
  var firstDay=new Date(y,m,1).getDay();
  var daysInMonth=new Date(y,m+1,0).getDate();
  var startOffset=(firstDay+6)%7;
  var tStr=today();
  var monthNames=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

  var html='';
  html+='<div class="page-header">'
    +'<div class="page-header-icon">📅</div>'
    +'<div class="page-header-info">'
    +'<div class="page-header-title">月度规划</div>'
    +'<div class="page-header-sub">备考节点 · 报考展示</div>'
    +'</div></div>';

  html+='<div class="card"><div class="cal-nav">'
    +'<button class="cal-nav-btn" onclick="prevMonth()">‹</button>'
    +'<span class="cal-nav-title">'+y+'年 '+monthNames[m]+'</span>'
    +'<button class="cal-nav-btn" onclick="nextMonth()">›</button></div>';
  html+='<div class="cal-grid">';
  ['一','二','三','四','五','六','日'].forEach(function(d){html+='<div class="cal-header">'+d+'</div>'});
  for(var i=0;i<startOffset;i++) html+='<div class="cal-cell empty"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday=ds===tStr;
    var note=state.calendarNotes[ds];
    var phase=getMilestoneForDate(ds);
    var style='';
    if(phase&&!isToday) style='background:'+phase.color+'1a';
    var cellText=note&&note.note?note.note.slice(0,3):'';
    if(!cellText&&phase) cellText=phase.name.slice(0,3);
    html+='<div class="cal-cell'+(isToday?' today':'')+(note?' has-note':'')+'" '
      +'style="'+style+'" onclick="selectDate(\''+ds+'\')">'
      +'<span class="cal-day">'+d+'</span>'
      +(cellText?'<span class="cal-note-text">'+esc(cellText)+'</span>':'')
      +'</div>';
  }
  html+='</div></div>';

  if(selectedDate){
    var note=state.calendarNotes[selectedDate]||{note:'',phase:''};
    html+='<div class="card"><div class="card-title"><span class="emoji">📝</span> '+selectedDate+' 备考标记</div>'
      +'<div style="font-size:12px;color:var(--c-text-2);margin-bottom:8px">选择该日备考阶段，也可随意写点备注。</div>'
      +'<select id="calPhase" style="width:100%;margin-bottom:8px">'
      +'<option value="">无特定阶段</option>'
      +state.milestones.map(function(ml){return '<option value="'+ml.id+'"'+(note.phase===ml.id?' selected':'')+'>'+esc(ml.name)+'</option>'}).join('')
      +'</select>'
      +'<textarea id="calNote" style="width:100%;min-height:60px;border:1px solid var(--c-border);border-radius:var(--r-sm);padding:10px;font-size:13px;resize:none" placeholder="在这里添加备注…">'+esc(note.note||'')+'</textarea>'
      +'<button class="btn btn-primary btn-block" style="margin-top:8px" onclick="saveCalNote(\''+selectedDate+'\')">保存标记</button></div>';
  }

  html+='<div class="card"><div class="card-title"><span class="emoji">🎯</span> 里程碑节点</div>';
  state.milestones.forEach(function(ml){
    html+='<div class="milestone-item"><div class="milestone-dot" style="background:'+ml.color+'"></div>'
      +'<div class="milestone-info"><div class="milestone-name">'+esc(ml.name)+'</div>'
      +'<div class="milestone-date">'+ml.start.slice(5)+' ~ '+ml.end.slice(5)+' · '+esc(ml.desc)+'</div></div></div>';
  });
  html+='</div>';

  html+='<div class="card"><div class="card-title"><span class="emoji">📊</span> 备考甘特图</div>'+renderGantt()+'</div>';

  $('#calendarContent').innerHTML=html;
}
function getMilestoneForDate(ds){return state.milestones.find(function(ml){return ds>=ml.start&&ds<=ml.end})}
function prevMonth(){calMonth--;if(calMonth<0){calMonth=11;calYear--}renderCalendar()}
function nextMonth(){calMonth++;if(calMonth>11){calMonth=0;calYear++}renderCalendar()}
function selectDate(ds){selectedDate=ds;renderCalendar()}
function saveCalNote(ds){
  var v=$('#calNote').value.trim();
  var phase=$('#calPhase').value;
  if(v||phase) state.calendarNotes[ds]={note:v,phase:phase};
  else delete state.calendarNotes[ds];
  saveData();
  showToast('📝 备考标记已保存',2000);
  renderCalendar();
}
function renderGantt(){
  if(!state.milestones||state.milestones.length===0) return '<div style="font-size:12px;color:var(--c-text-3)">暂无里程碑</div>';
  var sd=new Date(state.milestones[0].start+'T00:00:00');
  var ed=new Date(state.milestones[state.milestones.length-1].end+'T00:00:00');
  var total=(ed-sd)/86400000;
  var now=new Date();
  var todayPct=Math.min(100,Math.max(0,((now-sd)/86400000)/total*100));
  var monthLabels=[];
  var cur=new Date(sd.getFullYear(),sd.getMonth(),1);
  var endM=new Date(ed.getFullYear(),ed.getMonth(),1);
  while(cur<=endM){monthLabels.push((cur.getMonth()+1)+'月');cur.setMonth(cur.getMonth()+1)}
  var html='<div class="gantt-wrap">';
  html+='<div class="gantt-months">';
  monthLabels.forEach(function(ml){html+='<div class="gantt-month">'+ml+'</div>'});
  html+='</div><div class="gantt-bars" style="position:relative">';
  html+='<div class="gantt-today-line" style="left:'+todayPct+'%"><div class="gantt-today-label">今天</div></div>';
  state.milestones.forEach(function(ml){
    var st=new Date(ml.start+'T00:00:00');var en=new Date(ml.end+'T00:00:00');
    var left=((st-sd)/86400000)/total*100;
    var width=Math.max(3,((en-st)/86400000)/total*100);
    html+='<div class="gantt-bar" style="margin-left:'+left+'%;width:'+width+'%;background:'+ml.color+'"><span>'+esc(ml.name)+'</span></div>';
  });
  html+='</div></div>';
  return html;
}

/* ===== Export / Import / Template / Excel ===== */
function exportData(){
  var ts=new Date();
  var tsStr=ts.getFullYear()+'-'+String(ts.getMonth()+1).padStart(2,'0')+'-'+String(ts.getDate()).padStart(2,'0')+'_'+String(ts.getHours()).padStart(2,'0')+'-'+String(ts.getMinutes()).padStart(2,'0');
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='kaoyan-backup-'+tsStr+'.json';a.click();
  URL.revokeObjectURL(url);
  showToast('📤 数据已导出',2000);
}
function importData(e){
  var file=e.target.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      state=mergeState(JSON.parse(JSON.stringify(defaultState)),d);
      migrateState();
      saveData();
      updatePointsUI();
      renderAll();
      showToast('📥 数据已导入',2000);
    }catch(err){showToast('❌ 导入失败，文件格式错误',3000)}
  };
  reader.readAsText(file);
}

/* ===== Cloud Sync (GitHub API) ===== */
async function cloudSync(direction){
  var gh=state.github||{};
  var token=gh.token||_GH_TOKEN;
  if(!token){
    showToast('请先在设置中输入GitHub访问令牌',3000);
    return;
  }
  var repo=gh.repo||GH_DEFAULTS.repo;
  var branch=gh.branch||GH_DEFAULTS.branch;
  var path=gh.path||GH_DEFAULTS.path;

  showToast('☁️ '+(direction==='push'?'正在上传':'正在拉取')+'...',2000);

  try{
    if(direction==='push'){
      var content=btoa(unescape(encodeURIComponent(JSON.stringify(state,null,2))));
      /* Check if file exists to get SHA */
      var sha=null;
      try{
        var getResp=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path+'?ref='+branch,{
          headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
        });
        if(getResp.ok){
          var getData=await getResp.json();
          sha=getData.sha;
        }
      }catch(e){}

      var putResp=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{
        method:'PUT',
        headers:{'Authorization':'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
        body:JSON.stringify({
          message:'Cloud sync - '+new Date().toISOString(),
          content:content,
          sha:sha,
          branch:branch
        })
      });

      if(putResp.ok){
        showToast('☁️ 数据已上传到云端',3000);
      }else{
        var err=await putResp.json();
        showToast('上传失败: '+(err.message||'未知错误'),4000);
      }
    }else if(direction==='pull'){
      var getResp2=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path+'?ref='+branch,{
        headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
      });

      if(getResp2.ok){
        var getData2=await getResp2.json();
        var content2=decodeURIComponent(escape(atob(getData2.content)));
        var data=JSON.parse(content2);
        state=mergeState(JSON.parse(JSON.stringify(defaultState)),data);
        migrateState();
        saveData();
        renderAll();
        showToast('☁️ 数据已从云端恢复',3000);
      }else{
        var err2=await getResp2.json();
        showToast('拉取失败: '+(err2.message||'文件不存在或无权限'),4000);
      }
    }
  }catch(e){
    showToast('网络错误: '+e.message,4000);
  }
}

/* ===== Floating Input ===== */
function toggleFloat(){
  var p=$('#floatPanel');
  var b=$('#floatBtn');
  if(p.classList.contains('show')){
    p.classList.remove('show');
    b.textContent='💡';
  }else{
    p.classList.add('show');
    b.textContent='✕';
    $('#floatText').focus();
  }
}
function saveFloat(){
  var v=$('#floatText').value.trim();
  if(!v){toggleFloat();return}
  state.thoughts.push({id:uid(),content:v,date:today(),time:Date.now()});
  if(state.thoughts.length===10) checkBadges();
  saveData();
  $('#floatText').value='';
  toggleFloat();
  showToast('🧊 已存入想法冰箱',2000);
}

/* ===== Reminders ===== */
function initReminders(){
  setInterval(function(){
    if(Math.random()<0.25){
      var q=ANTI_PERF[Math.floor(Math.random()*ANTI_PERF.length)];
      showToast(q,5000);
    }
  },600000);
}

/* ===== Render All ===== */
function renderAll(){
  buildNav();
  updatePointsUI();
  renderHome();
}

/* ===== Init (async) ===== */
async function init(){
  try{
    db=await openDB();
  }catch(e){
    console.warn('IndexedDB open failed, using memory only',e);
  }
  await loadData();
  rolloverTasks();
  injectPWA();
  initSplash();
  /* Auto backup on open */
  autoBackup();
  /* Periodic backup every 30 minutes */
  if(backupTimer) clearInterval(backupTimer);
  backupTimer=setInterval(function(){autoBackup()},30*60*1000);
  /* Esc to close modal */
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
}
init();
</script>
