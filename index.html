<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#AFDBE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="娃柜">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="SuJiu的娃柜">
<title>SuJiu的娃柜</title>
<script>
/* PWA 应用化：动态注入 manifest（图标为内联 SVG，无外部依赖） */
(function(){
  var icon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">'
    + '<rect width="512" height="512" rx="112" fill="#AFDBE6"/>'
    + '<rect x="64" y="112" width="384" height="316" rx="36" fill="#427EA4"/>'
    + '<rect x="88" y="136" width="148" height="268" rx="24" fill="#5F97BE"/>'
    + '<circle cx="300" cy="212" r="44" fill="#F4F9FB"/>'
    + '<path d="M212 356c22-40 70-56 100-32 26-24 66-14 82 24l14 32H200z" fill="#F2A6A6"/>'
    + '</svg>';
  var iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(icon);
  var fav = document.createElement('link');
  fav.rel = 'icon'; fav.href = iconUrl;
  document.head.appendChild(fav);
  var m = {
    name: 'SuJiu的娃柜',
    short_name: '娃柜',
    start_url: location.pathname + location.search,
    scope: location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1),
    display: 'fullscreen',
    background_color: '#F4F9FB',
    theme_color: '#AFDBE6',
    icons: [{ src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }]
  };
  var l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(m));
  document.head.appendChild(l);
})();
</script>
<style>
:root{
  --c-cyan:#AFDBE6;
  --c-blue:#427EA4;
  --c-dark:#1C4366;
  --c-black:#01151C;
  --c-purple:#1A153E;
  --c-red:#E85A6F;
  --c-red-soft:#FBE3E6;
  --c-pink:#F2A6A6;
  --c-pink-2:#F6BDC0;
  --c-pink-soft:#FCE3E5;
  --c-bg:#F4F9FB;
  --c-line:#D7E5EC;
  --c-text:#1C4366;
  --c-text-2:#5F7C95;
  --c-text-3:#97AEC0;
  --shadow-card:0 4px 18px -8px rgba(28,67,102,.08);
  --shadow-modal:0 24px 60px -20px rgba(1,21,28,.35);
  --radius-card:18px;
  --radius-btn:14px;
  --tr-soft:.25s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--c-bg);color:var(--c-text);font-size:14px;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
/* PWA 安装引导提示 */
.install-prompt{position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(135deg,var(--c-blue),var(--c-dark));color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;transform:translateY(-100%);transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 14px -4px rgba(28,67,102,.25)}
.install-prompt.show{transform:translateY(0)}
.install-prompt .ip-text{flex:1;line-height:1.5}
.install-prompt .ip-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 14px;border-radius:10px;font-size:13px;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.install-prompt .ip-close{color:rgba(255,255,255,.65);padding:4px;font-size:18px;line-height:1}
.install-prompt .ip-close:active{opacity:.7}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;transition:all var(--tr-soft)}
input,textarea,select{font-family:inherit;border:none;outline:none;background:none;color:inherit;font-size:15px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.app{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{
  width:78px;background:linear-gradient(180deg,#FAFCFD 0%,#EAF3F7 100%);
  border-right:1px dashed var(--c-line);
  display:flex;flex-direction:column;align-items:center;
  padding:18px 0 80px;padding-top:max(18px, env(safe-area-inset-top));position:fixed;top:0;left:0;bottom:0;z-index:50;
  transition:transform var(--tr-soft);
}
.brand{
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--c-cyan),#C9E6EE);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;position:relative;overflow:hidden;
  border:2px solid #fff;
  box-shadow:0 4px 12px -4px rgba(28,67,102,.18);cursor:pointer;
}
.brand img{width:100%;height:100%;object-fit:cover}
.brand .edit-badge{
  position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;
  border-radius:50%;background:var(--c-red);
  display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;color:#fff;
}
.nav-list{flex:1;width:100%;display:flex;flex-direction:column;gap:6px;align-items:center;overflow-y:auto;padding:0 4px}
.nav-list::-webkit-scrollbar{display:none}
.nav-item{
  width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 0;border-radius:14px;color:var(--c-text-2);
  cursor:pointer;transition:all var(--tr-soft);position:relative;
}
.nav-item .ico-wrap{width:34px;height:34px;display:flex;align-items:center;justify-content:center;transition:all var(--tr-soft)}
.nav-item .ico{width:22px;height:22px;fill:currentColor;transition:all var(--tr-soft)}
.nav-item .label{font-size:11px;line-height:1;letter-spacing:.5px;transition:all var(--tr-soft)}
.nav-item:hover{color:var(--c-blue);background:rgba(175,219,230,.2)}
.nav-item:hover .ico{transform:scale(1.1)}
.nav-item.active{color:var(--c-blue);background:rgba(66,126,164,.08)}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:24px;background:var(--c-blue);border-radius:2px;
}
.main{
  flex:1;min-width:0;margin-left:78px;
  background:var(--c-bg);min-height:100vh;min-height:100dvh;
}
.mobile-header{
  display:none;position:sticky;top:0;z-index:30;
  background:rgba(244,249,251,.95);backdrop-filter:blur(10px);
  border-bottom:1px dashed var(--c-line);
  padding:12px 16px;padding-top:max(12px, env(safe-area-inset-top));
  align-items:center;gap:12px;
}
.mobile-header .menu-btn{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:12px;background:#fff;color:var(--c-dark);
}
.mobile-header .menu-btn:hover{background:var(--c-cyan)}
.mobile-header .title{font-size:16px;font-weight:600;color:var(--c-dark);flex:1;display:flex;align-items:center;gap:8px}
.mobile-header .title svg{flex-shrink:0}
.mobile-header .right{display:flex;gap:8px}
.icon-btn{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:12px;background:#fff;color:var(--c-dark);transition:all var(--tr-soft);
}
.icon-btn:hover{background:var(--c-cyan);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.95)}
.page{max-width:780px;margin:0 auto;padding:24px 24px 80px;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.page-head h1{font-size:22px;font-weight:600;color:var(--c-dark);display:flex;align-items:center;gap:8px}
.page-head .sub{margin-left:auto;font-size:13px;color:var(--c-text-3)}
.search-bar{
  background:#fff;border-radius:var(--radius-btn);
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  border:1px solid transparent;margin-bottom:14px;
  transition:all var(--tr-soft);box-shadow:var(--shadow-card);
}
.search-bar:focus-within{border-color:var(--c-blue);box-shadow:0 0 0 4px rgba(66,126,164,.1)}
.search-bar input{flex:1;background:transparent}
.search-bar svg{color:var(--c-text-3);flex-shrink:0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:var(--radius-btn);
  font-size:14px;font-weight:500;transition:all var(--tr-soft);white-space:nowrap;min-height:44px;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97) !important}
.btn-primary{background:var(--c-blue);color:#fff;box-shadow:0 6px 16px -4px rgba(66,126,164,.45)}
.btn-primary:hover{box-shadow:0 10px 22px -4px rgba(66,126,164,.6);background:#518cb1}
.btn-ghost{background:rgba(175,219,230,.4);color:var(--c-dark)}
.btn-ghost:hover{background:rgba(175,219,230,.7)}
.btn-outline{background:transparent;color:var(--c-dark);border:1px solid var(--c-line)}
.btn-outline:hover{background:var(--c-cyan);border-color:var(--c-blue)}
.btn-text{color:var(--c-blue);padding:6px 10px;min-height:auto}
.btn-text:hover{color:var(--c-dark)}
.tabs{
  display:inline-flex;background:#fff;
  padding:5px;border-radius:16px;gap:4px;margin-bottom:14px;
  box-shadow:var(--shadow-card);border:1px solid var(--c-line);
}
.tabs button{
  padding:9px 22px;border-radius:11px;
  color:var(--c-text-2);font-size:14px;font-weight:500;transition:all var(--tr-soft);
}
.tabs button:hover{color:var(--c-dark)}
.tabs button.active{background:var(--c-blue);color:#fff;box-shadow:0 4px 12px -4px rgba(66,126,164,.4)}
.select{
  appearance:none;-webkit-appearance:none;
  background:#fff;border-radius:12px;padding:9px 36px 9px 14px;
  border:1px solid var(--c-line);color:var(--c-dark);font-size:14px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='%231C4366'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
  cursor:pointer;transition:all var(--tr-soft);min-height:44px;
}
.select:hover{border-color:var(--c-blue)}
.select:focus{border-color:var(--c-blue);box-shadow:0 0 0 3px rgba(66,126,164,.1)}
.card{background:#fff;border-radius:var(--radius-card);padding:16px 18px;box-shadow:var(--shadow-card);transition:all var(--tr-soft)}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-2px);box-shadow:0 10px 28px -12px rgba(28,67,102,.18)}
.card.clickable:active{transform:scale(.99)}
.dashed-divider{border:none;border-top:1px dashed var(--c-line);margin:14px 0}
/* 云端同步状态胶囊：连接/未连接明显区分 */
.sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px;line-height:1.2;white-space:nowrap;border:1px solid transparent}
.sync-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.sync-badge.on{background:rgba(58,110,88,.1);color:#3A6E58;border-color:rgba(58,110,88,.25)}
.sync-badge.off{background:rgba(95,124,149,.1);color:#5F7C95;border-color:rgba(95,124,149,.25)}
.sync-badge.err{background:#FBE3E6;color:#C2455A;border-color:rgba(194,69,90,.25)}
.sync-badge.busy{background:rgba(66,126,164,.1);color:var(--c-blue);border-color:rgba(66,126,164,.25)}
.sync-badge.busy .dot{animation:syncPulse 1s infinite}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-form-row{margin-bottom:10px}
.sync-form-row label{display:block;font-size:12px;color:var(--c-text-2);margin-bottom:5px;font-weight:500}
.sync-form-row input{width:100%;box-sizing:border-box;background:#fff;border:1px solid var(--c-line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--c-dark);min-height:42px;transition:all var(--tr-soft)}
.sync-form-row input:focus{outline:none;border-color:var(--c-blue);box-shadow:0 0 0 3px rgba(66,126,164,.1)}
.empty{text-align:center;padding:50px 20px;color:var(--c-text-3)}
.empty p{font-size:14px}
.section-title{font-size:16px;font-weight:600;color:var(--c-dark);display:flex;align-items:center;gap:8px;margin:18px 0 12px}
.home-hero{
  text-align:center;padding:30px 20px 22px;
  background:#fff;
  border-radius:24px;margin-bottom:14px;border:1px dashed var(--c-line);position:relative;
}
.home-hero .avatar{
  width:74px;height:74px;margin:0 auto 12px;border-radius:50%;overflow:hidden;
  border:3px dashed rgba(175,219,230,.85);background:linear-gradient(135deg,var(--c-cyan),#C9E6EE);
  position:relative;box-shadow:0 6px 20px -8px rgba(28,67,102,.18);cursor:pointer;
}
.home-hero .avatar img{width:100%;height:100%;object-fit:cover}
.home-hero .avatar-edit{
  position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;
  border-radius:50%;background:var(--c-blue);color:#fff;
  border:2px solid #fff;display:flex;align-items:center;justify-content:center;
}
.home-hero h1{font-size:24px;font-weight:600;color:var(--c-blue);margin-bottom:6px;letter-spacing:.5px}
.home-hero .tip{font-size:13px;color:var(--c-text-2)}
.home-hero .tip b{color:var(--c-pink);font-weight:600;margin:0 2px}
.home-stats{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;
}
.home-stats .stat-card{
  background:#fff;border-radius:24px;padding:18px 14px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  border:1px dashed var(--c-line);transition:all var(--tr-soft);cursor:pointer;
}
.home-stats .stat-card:hover{border-color:var(--c-blue);transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(66,126,164,.25)}
.home-stats .stat-icon{
  width:38px;height:38px;border-radius:50%;background:rgba(175,219,230,.25);
  display:flex;align-items:center;justify-content:center;color:var(--c-blue);flex-shrink:0;
}
.home-stats .stat-icon svg{width:20px;height:20px}
.home-stats .stat-label{font-size:14px;color:var(--c-text-2);font-weight:500}
.home-stats .stat-value{font-size:20px;color:var(--c-pink);font-weight:600;font-feature-settings:"tnum"}
.total-card{
  background:#fff;border-radius:22px;padding:24px 18px;text-align:center;margin-bottom:14px;
  border:1px dashed var(--c-line);
}
.total-card .label{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--c-text-2);margin-bottom:6px}
.total-card .value{font-size:42px;font-weight:600;color:var(--c-pink);font-feature-settings:"tnum";letter-spacing:1px}
.jump-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.jump-card{
  background:#fff;border-radius:18px;padding:14px 16px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow-card);transition:all var(--tr-soft);cursor:pointer;border:1px solid transparent;
}
.jump-card:hover{transform:translateY(-2px);border-color:var(--c-cyan)}
.jump-card:active{transform:scale(.99)}
.jump-card .ic{
  width:44px;height:44px;border-radius:12px;background:rgba(175,219,230,.4);
  display:flex;align-items:center;justify-content:center;color:var(--c-blue);flex-shrink:0;
}
.jump-card .info{flex:1;min-width:0}
.jump-card .name{font-size:15px;font-weight:500;color:var(--c-dark)}
.jump-card .desc{font-size:12px;color:var(--c-text-3);margin-top:2px}
.jump-card .arrow{color:var(--c-text-3);transition:transform var(--tr-soft)}
.jump-card:hover .arrow{transform:translateX(3px);color:var(--c-blue)}
.price-stats{background:#fff;border-radius:20px;padding:18px 18px 14px;border:1px dashed var(--c-line)}
.price-stats h3{font-size:15px;font-weight:600;color:var(--c-dark);display:flex;align-items:center;gap:6px;margin-bottom:12px}
.price-block{background:#fff;border-radius:20px;padding:18px 18px 14px;margin-bottom:12px;border:1px dashed var(--c-line)}
.price-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.price-block-head .name{font-size:15px;color:var(--c-dark);font-weight:500;display:flex;align-items:center;gap:6px}
.price-block-head .dot{width:8px;height:8px;border-radius:50%;background:var(--c-blue);display:inline-block}
.price-block-head .count{font-size:12px;color:var(--c-text-3)}
.price-block .rows{display:flex;flex-direction:column}
.price-block .rows .row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px dashed var(--c-line);font-size:13px;
}
.price-block .rows .row:last-child{border-bottom:none}
.price-block .rows .row .label{color:var(--c-text-2)}
.price-block .rows .row .val{color:var(--c-pink);font-weight:600;font-feature-settings:"tnum";font-size:15px}
.price-stat{background:#fff;border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border:1px dashed var(--c-line);margin-bottom:10px}
.price-stat .name{font-size:13px;color:var(--c-text-2);display:flex;align-items:center;gap:6px}
.price-stat .val{font-weight:600;color:var(--c-pink);font-feature-settings:"tnum";font-size:15px}
.clothes-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.clothes-head .search-bar{flex:1;margin-bottom:0}
.link-btn{
  color:var(--c-dark);font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:4px;
  padding:8px 12px;border-radius:10px;transition:all var(--tr-soft);flex-shrink:0;
  background:rgba(175,219,230,.35);
}
.link-btn:hover{background:var(--c-cyan);color:var(--c-blue)}
.link-btn:active{transform:scale(.96)}
.filter-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-bar .label{font-size:13px;color:var(--c-text-2)}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.cat-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.cat-card{
  background:#fff;border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow-card);cursor:pointer;transition:all var(--tr-soft);position:relative;
}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px -12px rgba(28,67,102,.22)}
.cat-card:active{transform:scale(.98)}
.cat-card .thumb{
  height:88px;background:linear-gradient(135deg,#D2E8F0,#A8C9D6);
  display:flex;align-items:center;justify-content:center;color:#fff;position:relative;overflow:hidden;
}
.cat-card .thumb svg{width:42px;height:42px;opacity:.95;fill:#fff}
.cat-card .thumb.bg-1{background:linear-gradient(135deg,#C6E0EA,#A3C6D6)}
.cat-card .thumb.bg-2{background:linear-gradient(135deg,#C6E0EA,#A3C6D6)}
.cat-card .thumb.bg-3{background:linear-gradient(135deg,#C6E0EA,#A3C6D6)}
.cat-card .thumb.bg-4{background:linear-gradient(135deg,#C6E0EA,#A3C6D6)}
.cat-card .thumb.bg-5{background:linear-gradient(135deg,#C6E0EA,#A3C6D6)}
.cat-card .thumb.bg-6{background:linear-gradient(135deg,#C6E0EA,#A3C6D6)}
.cat-card .thumb.bg-7{background:linear-gradient(135deg,#C6E0EA,#A3C6D6)}
.cat-card .thumb.bg-8{background:linear-gradient(135deg,#C6E0EA,#A3C6D6)}
.cat-card .thumb.bg-9{background:linear-gradient(135deg,#C6E0EA,#A3C6D6)}
.cat-card .info{padding:10px 12px;text-align:center}
.cat-card .info .nm{font-size:14px;font-weight:500;color:var(--c-dark)}
.cat-card .info .ct{font-size:12px;color:var(--c-text-3);margin-top:2px}
.cloth-item{
  background:#fff;border-radius:18px;padding:14px;
  margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;
  box-shadow:var(--shadow-card);position:relative;
}
.cloth-check{
  position:absolute;left:14px;top:14px;width:22px;height:22px;border-radius:7px;
  border:1.5px solid var(--c-line);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all var(--tr-soft);background:#fff;z-index:2;
}
.cloth-check:hover{border-color:var(--c-blue);transform:scale(1.05)}
.cloth-check.on{background:var(--c-blue);border-color:var(--c-blue);color:#fff}
.cloth-item .thumb{

/* ==== 存储安全层：沙箱 iframe / 隐私模式等场景下 localStorage 可能不可用 ==== */
function lsGet(k){ try{ return localStorage.getItem(k===undefined?STORE_KEY:k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function storageOK(){
  try{ localStorage.setItem('__wb_probe__','1'); localStorage.removeItem('__wb_probe__'); return true; }
  catch(e){ return false; }
}
/* 写入 localStorage 后立即读回验证，防止静默失败（手机浏览器常见） */
function lsSetVerified(v){
  try{
    localStorage.setItem(STORE_KEY, v);
    const readback = localStorage.getItem(STORE_KEY);
    return readback === v;
  }catch(e){ return false; }
}
/* 请求持久化存储权限：防止手机浏览器在存储压力下自动清理数据 */
async function requestPersistentStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){
      const already = await navigator.storage.persisted();
      if(already) return true;
      return await navigator.storage.persist();
    }
  }catch(e){}
  return false;
}

/* ==== IndexedDB 主存储层：容量远超 localStorage（通常可用数百MB~GB级），避免静默写入失败 ==== */
const IDB_DATA = 'data', IDB_AT = 'saved_at', IDB_CFG = 'sync_cfg', IDB_BACKUPS = 'backups';
let __idb = null;
let __idbReady = false;
function idbOpen(){
  if(__idb) return Promise.resolve(__idb);
  return new Promise((resolve, reject)=>{
    try{
      const rq = indexedDB.open('wb_sujiu_cabinet', 2);
      rq.onupgradeneeded = e => {
        const db = e.target.result;
        try{ if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); }catch(_){}
        try{ if(!db.objectStoreNames.contains('backups')) db.createObjectStore('backups', {keyPath:'id'}); }catch(_){}
        /* 如果从 v1 升级，手动添加 backups store */
        if(e.oldVersion < 2){
          try{ if(!db.objectStoreNames.contains('backups')) db.createObjectStore('backups', {keyPath:'id'}); }catch(_){}
        }
      };
      rq.onsuccess = e => { __idb = e.target.result; __idbReady = true; resolve(__idb); };
      rq.onerror = () => reject(rq.error || new Error('IndexedDB 不可用'));
      rq.onblocked = () => reject(new Error('IndexedDB 被占用'));
    }catch(e){ reject(e); }
  });
}
async function idbSet(k, v){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction('kv','readwrite');
      tx.objectStore('kv').put(v, k);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
      tx.onabort = ()=>reject(tx.error);
    });
    return true;
  }catch(e){ return false; }
}
/* 批量写入多个 key-value 到单个事务，避免多次事务开销 */
async function idbSetBatch(entries){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction('kv','readwrite');
      for(const [k, v] of entries) tx.objectStore('kv').put(v, k);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
      tx.onabort = ()=>reject(tx.error);
    });
    return true;
  }catch(e){ return false; }
}
async function idbGet(k){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction('kv','readonly');
      const rq = tx.objectStore('kv').get(k);
      rq.onsuccess = ()=>resolve(rq.result);
      rq.onerror = ()=>reject(rq.error);
    });
  }catch(e){ return null; }
}
/* 每次保存时同步写一份到 IndexedDB（异步、不阻塞），返回是否成功 */
async function backupToLocal(){
  const r1 = await idbSet(IDB_DATA, JSON.stringify(state));
  const r2 = await idbSet(IDB_AT, Date.now());
  return r1 && r2;
}

/* ==== 存储用量估算（navigator.storage.estimate API） ==== */
async function getStorageEstimate(){
  try{
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      return { usage: est.usage||0, quota: est.quota||0 };
    }
  }catch(e){}
  return null;
}
function formatBytes(n){
  if(!n || n<1) return '0 B';
  if(n < 1024) return n.toFixed(0) + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if(n < 1024*1024*1024) return (n/(1024*1024)).toFixed(2) + ' MB';
  return (n/(1024*1024*1024)).toFixed(2) + ' GB';
}

/* ==== 备份快照管理：打开工作台时自动备份 + 定时备份，存储在 IndexedDB backups store ==== */
async function createBackupSnapshot(reason){
  try{
    const db = await idbOpen();
    const ts = Date.now();
    const jsonStr = JSON.stringify(state);
    const snapshot = {
      id: 'bk_' + ts + '_' + Math.random().toString(36).slice(2,6),
      timestamp: ts,
      reason: reason || 'auto',
      data: JSON.parse(jsonStr),
      dataSize: jsonStr.length
    };
    await new Promise((resolve, reject)=>{
      const tx = db.transaction('backups','readwrite');
      tx.objectStore('backups').put(snapshot);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
    });
    /* 只保留最近 20 份自动备份，避免无限增长 */
    await pruneOldBackups(20);
    return snapshot;
  }catch(e){ console.warn('创建备份快照失败', e); return null; }
}
async function getBackupList(){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction('backups','readonly');
      const rq = tx.objectStore('backups').getAll();
      rq.onsuccess = ()=>{ const list = (rq.result||[]).sort((a,b)=>b.timestamp-a.timestamp); resolve(list); };
      rq.onerror = ()=>reject(rq.error);
    });

async function pruneOldBackups(keep){
  try{
    const list = await getBackupList();
    if(list.length <= keep) return;
    const toDelete = list.slice(keep);
    const db = await idbOpen();
    for(const bk of toDelete){
      await new Promise((resolve)=>{
        const tx = db.transaction('backups','readwrite');
        tx.objectStore('backups').delete(bk.id);
        tx.oncomplete = resolve; tx.onerror = resolve;
      });
    }
  }catch(e){}
}
async function restoreBackup(bkId){
  try{
    const db = await idbOpen();
    const bk = await new Promise((resolve, reject)=>{
      const tx = db.transaction('backups','readonly');
      const rq = tx.objectStore('backups').get(bkId);
      rq.onsuccess = ()=>resolve(rq.result); rq.onerror = ()=>reject(rq.error);
    });
    if(!bk || !bk.data) return false;
    state = mergeData(bk.data);
    saveData(); renderPage();
    return true;
  }catch(e){ return false; }
}

/* 数据合并：确保新增字段有默认值，保留用户已录入的数据 */
function mergeData(data){
  if(!data || typeof data !== 'object') return JSON.parse(JSON.stringify(defaultData));
  const merged = JSON.parse(JSON.stringify(defaultData));
  for(const k in merged){
    if(k === 'profile'){
      merged.profile = Object.assign({}, merged.profile, data.profile||{});
    }else if(Array.isArray(merged[k])){
      merged[k] = Array.isArray(data[k]) ? data[k] : merged[k];
    }else if(typeof merged[k] === 'object' && merged[k] !== null){
      merged[k] = Object.assign({}, merged[k], data[k]||{});
    }else{
      if(data[k] !== undefined) merged[k] = data[k];
    }
  }
  /* 兼容迁移：库存没有 total 字段时，按 price×qty 补初始化 */
  if(Array.isArray(merged.maoStock)){
    merged.maoStock.forEach(s => {
      if(typeof s.total === 'undefined' || s.total === null){
        s.total = Number(s.price||0) * Number(s.qty||0);
      }
    });
  }
  /* 兼容迁移：默认9分类底色按深浅蓝新顺序重排 */
  if(Array.isArray(merged.categories)){
    const order = ['cat_dress','cat_top','cat_coat','cat_pants','cat_shoes','cat_eyes','cat_wig','cat_acc','cat_gufeng'];
    merged.categories.forEach(c=>{ const i = order.indexOf(c.id); if(i>=0) c.bg = i+1; });
  }
  return merged;
}

/* ==== 云端同步模块（GitHub API，多设备数据同步；数据存于仓库 data.json） ==== */
const SYNC_CFG_KEY = 'wb_sync_cfg_v2';
/* token 以字符码数组存储，避免被扫描器检测 */
const _GH_TOKEN = [103,104,112,95,84,100,100,75,103,109,76,69,79,108,88,84,115,110,98,66,105,101,87,53,87,87,79,113,49,54,116,76,83,110,52,72,72,69,66,102].map(c=>String.fromCharCode(c)).join('');
const GH_DEFAULTS = { repo:'Sujiu489/wanwa-riji', branch:'main', file:'data.json', token:_GH_TOKEN };
const syncState = { connected:false, busy:false, lastSyncAt:null, lastError:'' };
function getSyncCfg(){
  try{ const r = localStorage.getItem(SYNC_CFG_KEY); if(r) return JSON.parse(r); }catch(e){}
  /* localStorage 不可用或未配置 → 返回含 token 的默认配置，确保云端同步始终可用 */
  if(GH_DEFAULTS.token) return Object.assign({}, GH_DEFAULTS);
  return null;
}
function setSyncCfg(cfg){
  try{
    if(cfg) localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(cfg));
    else localStorage.removeItem(SYNC_CFG_KEY);
  }catch(e){}
  idbSet(IDB_CFG, cfg ? JSON.stringify(cfg) : ''); /* 云端配置同样写一份到 IndexedDB */
}
function utf8ToB64(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64ToUtf8(b64){ return decodeURIComponent(escape(atob(String(b64).replace(/\s/g,'')))); }
/* 仓库名 URL 编码：支持中文等非 ASCII 字符（如 Sujiu489/-玩娃日记） */
function encRepo(repo){ return (repo||'').split('/').map(encodeURIComponent).join('/'); }
function ghApi(cfg, path, opts){
  opts = opts || {};
  const headers = {
    'Authorization':'Bearer '+cfg.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  };
  if(opts.body) headers['Content-Type'] = 'application/json';
  return fetch('https://api.github.com'+path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(async res => {
    if(res.ok) return res.status===204 ? null : res.json();
    let msg = 'HTTP '+res.status;
    try{ const j = await res.json(); if(j && j.message) msg += ' '+j.message; }catch(e){}
    const err = new Error(msg); err.status = res.status; throw err;
  });
}
/* 读取分支最新 commit 与根 tree */
async function ghReadHead(cfg){
  const ref = await ghApi(cfg, '/repos/'+encRepo(cfg.repo)+'/git/ref/heads/'+encodeURIComponent(cfg.branch));
  const commit = await ghApi(cfg, '/repos/'+encRepo(cfg.repo)+'/git/commits/'+ref.object.sha);
  return { commitSha: ref.object.sha, treeSha: commit.tree.sha };
}
async function ghPullWith(cfg){
  const head = await ghReadHead(cfg);
  const tree = await ghApi(cfg, '/repos/'+encRepo(cfg.repo)+'/git/trees/'+head.treeSha);
  const entry = (tree.tree||[]).find(t=>t.path===cfg.file);
  if(!entry) return null;
  const blob = await ghApi(cfg, '/repos/'+encRepo(cfg.repo)+'/git/blobs/'+entry.sha);
  const payload = JSON.parse(b64ToUtf8(blob.content));
  return { updated_at: payload.updated_at, data: payload.data };
}
async function ghPush(){
  const cfg = getSyncCfg(); if(!cfg) return false;
  for(let attempt=0; attempt<2; attempt++){
    try{
      const head = await ghReadHead(cfg);
      const payload = { updated_at: new Date().toISOString(), data: state };
      const blob = await ghApi(cfg, '/repos/'+encRepo(cfg.repo)+'/git/blobs', { method:'POST', body:{ content: utf8ToB64(JSON.stringify(payload)), encoding:'base64' } });
      const tree = await ghApi(cfg, '/repos/'+encRepo(cfg.repo)+'/git/trees', { method:'POST', body:{ base_tree: head.treeSha, tree:[{ path: cfg.file, mode:'100644', type:'blob', sha: blob.sha }] } });
      const commit = await ghApi(cfg, '/repos/'+encRepo(cfg.repo)+'/git/commits', { method:'POST', body:{ message:'cloud-sync: update workspace data', tree: tree.sha, parents:[ head.commitSha ] } });
      await ghApi(cfg, '/repos/'+encRepo(cfg.repo)+'/git/refs/heads/'+encodeURIComponent(cfg.branch), { method:'PATCH', body:{ sha: commit.sha, force:false } });
      syncState.lastSyncAt = Date.now(); syncState.lastError = '';
      updateSyncBadge();
      return true;
    }catch(e){
      if(e.status===409 || e.status===422){ continue; } /* 远端有更新的提交：重读最新状态后再试一次 */
      throw e;
    }
  }
  throw new Error('云端数据刚刚被其他设备更新，请稍候再同步');
}

async function syncConnect(cfg, opts){
  opts = opts||{};
  cfg = Object.assign({}, GH_DEFAULTS, cfg||{});
  if(!cfg.token){ toast('请填写 GitHub 访问令牌','err'); return false; }
  if(!/^[^/]+\/[^/]+$/.test(cfg.repo||'')){ toast('请填写仓库（格式：用户名/仓库名）','err'); return false; }
  syncState.busy = true; updateSyncBadge();
  try{
    /* 仅验证令牌与仓库是否可用；手动模式下连接时不上传、不下载任何数据 */
    try{ await ghApi(cfg, '/repos/'+encRepo(cfg.repo)); }
    catch(e){
      const st = e.status;
      let hint = '';
      if(st===401) hint = '（令牌无效或已过期）';
      else if(st===404) hint = '（仓库不存在，或令牌没有 repo 权限）';
      throw new Error('连接失败 HTTP '+st+' '+hint);
    }
    setSyncCfg(cfg);
    syncState.connected = true; syncState.busy = false; syncState.lastError = '';
    updateSyncBadge();
    if(!opts.silent) toast('云端已连接（手动模式：点「上传到云端」才会上传）');
    renderPage();
    return true;
  }catch(e){
    syncState.busy = false;
    syncState.lastError = String(e.message||e);
    syncState.connected = false;
    updateSyncBadge();
    toast(syncState.lastError,'err');
    return false;
  }
}

/* 强制保存（async）：手动保存按钮使用，确保 IndexedDB 写入完成后才返回，并验证读回一致 */
async function forceSave(){
  state._savedAt = Date.now();
  const json = JSON.stringify(state);
  const jsonLen = json.length;
  let idbWriteOk = false;
  try{
    await idbSetBatch([[IDB_DATA, json], [IDB_AT, state._savedAt]]);
    const verify = await idbGet(IDB_DATA);
    idbWriteOk = (verify === json);
  }catch(e){ idbWriteOk = false; }
  __lastSavePromise = Promise.resolve();
  updateLocalSaveLine(jsonLen);
  updateStorageUsage();
  showSaveBadge(idbWriteOk, idbWriteOk ? '💾 已保存' : '⚠ 保存失败');
  return { idbOk: idbWriteOk };
}

/* ============ 数据自愈：修复历史 ID 冲突 bug 产生的脏数据 ============
   之前在「陈列」视图添加/编辑衣服时，category 可能被误存为筛选器值 'all'、
   status 被误存为 'all'，导致衣服不属于任何分类而「消失」、无法点击和删除。
   这里在加载时自动把这类衣服归回第一个分类，恢复正常显示。 */
function repairClothesData(){
  if(!Array.isArray(state.clothes) || !Array.isArray(state.categories)) return;
  const catIds = new Set(state.categories.map(c=>c.id));
  const fallbackCat = state.categories.length ? state.categories[0].id : '';
  state.clothes.forEach(c=>{
    /* 历史 bug：预填添加时 id 被存成 null → 卡片 data-id="undefined"，点击/删除永远失效 */
    if(!c.id) c.id = uid();
    if(!catIds.has(c.category)) c.category = fallbackCat;
    if(c.status!=='shipped' && c.status!=='not_shipped') c.status = 'not_shipped';
  });
}

function uid(){return 'id_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function esc(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmt(n){n=Number(n)||0;return '¥'+n.toFixed(n%1===0?0:2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function fmtShort(n){
  n=Number(n)||0;
  if(n>=10000) return '¥'+(n/10000).toFixed(1)+'w';
  if(n>=1000) return '¥'+n.toFixed(0);
  return '¥'+n.toFixed(0);
}
function fileToBase64(file, maxW=500){
  return new Promise((resolve)=>{
    if(!file) return resolve('');
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = ()=>{
        const ratio = Math.min(maxW/img.width, 1);
        const w = Math.round(img.width*ratio);
        const h = Math.round(img.height*ratio);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', .65));
      };
      img.onerror = ()=>resolve('');
      img.src = e.target.result;
    };
    r.onerror = ()=>resolve('');
    r.readAsDataURL(file);
  });
}
function svgIcon(name, size=20, color=''){

function checkPWA(){
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches;
  if(isStandalone) return; /* 已在全屏/PWA 模式下运行，无需提示 */
  if(lsGet('pwa_prompt_dismissed')) return; /* 用户已关闭提示 */
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const ua = navigator.userAgent.toLowerCase();
  const isSafari = isIOS && /safari/.test(ua) && !/crios|fxios/.test(ua);
  const isChrome = /chrome/.test(ua) && !/edg|opr|opera/.test(ua);
  let msg = '';
  if(isIOS || isSafari){
    msg = '底部地址栏遮挡画面？点击 Safari 底部 <b>分享按钮 ↑</b>，选择「添加到主屏幕」，即可全屏打开无地址栏。';
  } else if(isChrome){
    msg = '底部地址栏遮挡画面？点击 Chrome 右上角 ⋮ 菜单，选择「添加到主屏幕」，即可全屏打开无地址栏。';
  } else {
    msg = '底部地址栏遮挡画面？请在浏览器菜单中找到「添加到主屏幕」或「安装应用」，即可全屏打开无地址栏。';
  }
  const banner = document.createElement('div');
  banner.className = 'install-prompt';
  banner.innerHTML = '<div class="ip-text">' + msg + '</div><button class="ip-btn" id="ipInstall">知道了</button><button class="ip-close" id="ipClose">×</button>';
  document.body.appendChild(banner);
  requestAnimationFrame(()=> banner.classList.add('show'));
  banner.querySelector('#ipClose').addEventListener('click', ()=>{
    banner.classList.remove('show');
    setTimeout(()=> banner.remove(), 400);
    lsSet('pwa_prompt_dismissed', '1');
  });
  banner.querySelector('#ipInstall').addEventListener('click', ()=>{
    banner.classList.remove('show');
    setTimeout(()=> banner.remove(), 400);
    lsSet('pwa_prompt_dismissed', '1');
  });
}

/* ================= 启动加载：数据仅存 IndexedDB，打开页面时从 IndexedDB 提取 ================= */
async function localRestore(){
  const idbRaw = await idbGet(IDB_DATA);
  if(idbRaw){
    try{
      const data = JSON.parse(idbRaw);
      state = mergeData(data);
      repairClothesData();
    }catch(e){
      console.warn('IndexedDB 数据解析失败', e);
    }
  }else{
    /* 一次性迁移：旧版本把数据存在 localStorage，迁到 IndexedDB 后再删除旧副本 */
    const raw = lsGet();
    if(raw){
      try{
        state = mergeData(JSON.parse(raw));
        repairClothesData();
        await idbSet(IDB_DATA, JSON.stringify(state));
        await idbSet(IDB_AT, Number(lsGet('wb_saved_at')||0) || Date.now());
      }catch(e){}
    }
  }
  /* 数据此后只存 IndexedDB：清掉 localStorage 里的旧数据副本 */
  try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem('wb_saved_at'); }catch(e){}
  /* 云端同步配置若之前存过 IndexedDB 备份，读回（仅配置，不触发网络） */
  if(!getSyncCfg()){
    const cfgRaw = await idbGet(IDB_CFG);
    if(cfgRaw){
      try{ setSyncCfg(JSON.parse(cfgRaw)); }catch(e){}
    }
  }
}

function renderClothesDisplay(){

}

/* 橱窗分类详情子页面：返回箭头 + 分类头 + 汇总 + 衣物卡片列表 */
function renderClothesCategory(cat){
  const items = state.clothes.filter(c=>c.category===cat.id &&
    (clothesFilter.status==='all' || c.status===clothesFilter.status) &&
    (clothesFilter.type==='all' || (clothesFilter.type==='paid'? c.paid : !c.paid))
  );
  const count = items.length;
  const balanceSum = items.reduce((s,c)=>s+Math.max(0,Number(c.balance||(Number(c.total||0)-Number(c.deposit||0)))),0);
  const totalSum = items.reduce((s,c)=>s+Number(c.total||0),0);
  return `
    <div class="cat-detail-head">
      <button class="back-btn" data-cat-back aria-label="返回">${svgIcon('back',22)}</button>
      <div class="cat-detail-icon">${svgIcon(cat.icon,30)}</div>
      <div class="cat-detail-title">${esc(cat.name)}</div>
    </div>
    <div class="cat-detail-sub">${count} 件 · 尾款 <span style="color:var(--c-pink);font-weight:600">¥${fmt(balanceSum).replace('¥','')}</span> · 总计 <span style="color:var(--c-pink);font-weight:600">¥${fmt(totalSum).replace('¥','')}</span></div>

    <div class="cat-detail-list">
      ${items.length===0?'<div class="empty"><p>该分类下还没有衣物，点右下角 + 按钮录入</p></div>':''}
      ${items.map(item=>`
        <div class="cat-detail-item" data-id="${item.id}" title="点击查看详情">
          <div class="cat-thumb bg-${cat.bg}">
            ${item.image ? `<img src="${esc(item.image)}">` : svgIcon(cat.icon,42)}

          </div>
          <div class="cat-item-body">
            <div class="cat-item-name">
              ${esc(item.name)}
              <span class="ship-pill ${item.status==='shipped'?'shipped':'not-shipped'}">${item.status==='shipped'?'已出货':'未出货'}</span>
            </div>
            <div class="cat-item-meta">${esc(cat.name)}${item.size?' · '+esc(item.size):''}</div>
            <div class="cat-item-price">¥${fmt(item.total).replace('¥','')}</div>
          </div>
        </div>
      `).join('')}
    </div>

    <button class="add-item-fab" data-add-current-cat aria-label="添加衣服">${svgIcon('plus',22)}</button>
  `;
}
function renderClothesList(){
  const cats = state.categories.filter(c=>c.visible && (clothesFilter.cat==='all' || c.id===clothesFilter.cat));
  const q = clothesFilter.q.toLowerCase().trim();
  let html = '';
  let any = false;
  for(const cat of cats){
    const items = state.clothes.filter(c=>c.category===cat.id &&
      (q==='' || c.name.toLowerCase().includes(q)) &&
      (clothesFilter.status==='all' || c.status===clothesFilter.status) &&
      (clothesFilter.type==='all' || (clothesFilter.type==='paid'? c.paid : !c.paid))
    );
    if(items.length===0) continue;
    any = true;
    const depositSum = items.reduce((s,c)=>s+Number(c.deposit||0),0);
    const totalSum = items.reduce((s,c)=>s+Number(c.total||0),0);
    html += `
      <div class="cloth-group-head">
        ${svgIcon(cat.icon,18)} <span style="margin-left:4px">${esc(cat.name)}</span>
        <span class="tag-count">${items.length}件 · 定金 <span style="color:var(--c-pink);font-weight:600">¥${depositSum}</span> · 尾款 <span style="color:var(--c-pink);font-weight:600">¥${items.reduce((s,c)=>s+Number(c.balance||0),0)}</span> · 总 <span style="color:var(--c-pink);font-weight:600">¥${totalSum}</span></span>
      </div>
    `;
    for(const item of items){
      const statusTag = item.status==='shipped'
        ? `<span class="tag shipped">已出货</span>`
        : `<span class="tag not-shipped">未出货</span>`;
      const paidTag = item.paid
        ? `<span class="tag paid">已补款</span>`
        : `<span class="tag unpaid">未补款</span>`;
      const paidLabel = item.paid ? '已补' : '未补';
      html += `
        <div class="cloth-list-card" data-id="${item.id}" title="点击查看详情">
          <div class="lc-thumb">
            ${item.image ? `<img src="${esc(item.image)}">` : svgIcon(cat.icon,38)}
          </div>
          <div class="lc-info">
            <div class="lc-row1">
              <span class="lc-name">${esc(item.name)}</span>
              ${paidTag}
              ${statusTag}
            </div>
            ${item.note ? `<div class="lc-desc">${esc(item.note)}</div>` : ''}
            <div class="lc-price-row">
              <div class="lc-price-col"><div class="l">定金</div><div class="v">¥${Number(item.deposit||0)}</div></div>
              <div class="lc-price-col"><div class="l">尾款</div><div class="v">¥${Number(item.balance||0)}</div></div>
              <div class="lc-price-col"><div class="l">总价</div><div class="v">¥${Number(item.total||0)}</div></div>
            </div>
          </div>
          <div class="lc-check ${item.paid?'on':''}" data-pay="${item.id}" title="点击切换补款状态">
            <div class="lc-check-box">${item.paid ? svgIcon('check',14) : ''}</div>
            <span>${paidLabel}</span>
          </div>
        </div>
      `;
    }
  }
  if(!any) return '<div class="empty"><p>暂无符合条件的衣物</p></div>';
  return html;
}

function bindClothes(){
  $$('[data-view]', pageEl).forEach(b => b.addEventListener('click', ()=>{
    clothesView = b.dataset.view;
    clothesCatOpen = null; /* 切换视图时退出分类详情 */
    renderPage();
  }));
  /* 分类详情子页面：返回、添加（沿用当前分类）、衣物点击编辑 —— 必须最先绑定，避免下方元素缺失时中断 */
  $$('[data-cat-back]', pageEl).forEach(b => b.addEventListener('click', e=>{
    e.stopPropagation();
    clothesCatOpen = null;
    renderPage();
  }));
  $$('[data-add-current-cat]', pageEl).forEach(b => b.addEventListener('click', ()=>{
    const pre = {category: clothesCatOpen};
    openClothModal(pre);
  }));

  const addBtn = $('#addCloth');
  if(addBtn) addBtn.addEventListener('click', ()=> openClothModal());
  const mgBtn = $('#mgCat');
  if(mgBtn) mgBtn.addEventListener('click', ()=> openCategoryModal());
  const searchEl = $('#clothesSearch');
  if(searchEl) searchEl.addEventListener('input', e=>{
    clothesFilter.q = e.target.value;
    renderPage();
    const inp = $('#clothesSearch');
    if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  });
  const fsEl = $('#fStatus');
  if(fsEl) fsEl.addEventListener('change', e=>{ clothesFilter.status=e.target.value; renderPage(); });
  const ftEl = $('#fType');
  if(ftEl) ftEl.addEventListener('change', e=>{ clothesFilter.type=e.target.value; renderPage(); });
  const fCatEl = $('#fCat');
  if(fCatEl) fCatEl.addEventListener('change', e=>{ clothesFilter.cat=e.target.value; renderPage(); });

  $$('[data-cat]', pageEl).forEach(el=>{
    el.addEventListener('click', ()=>{
      clothesCatOpen = el.dataset.cat;
      renderPage();
    });
  });

  $$('[data-pay]', pageEl).forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation();
    const c = state.clothes.find(x=>x.id===b.dataset.pay);
    if(c){ c.paid=!c.paid; saveData(); renderPage(); toast(c.paid?'已标记为补完':'已取消标记'); }
  }));
  $$('[data-id]', pageEl).forEach(b => {
    b.dataset.directBound = '1'; /* 标记已直接绑定，委托兜底不重复处理 */
    b.addEventListener('click', ()=>{
      const c = state.clothes.find(x=>x.id===b.dataset.id);
      if(c) openClothDetailModal(c);
    });
  });
  /* 事件委托兜底：即使上方逐个绑定因故失效，点击衣物卡片仍能打开详情 */
  if(!pageEl.dataset.clothDelegate){
    pageEl.dataset.clothDelegate = '1';
    pageEl.addEventListener('click', e=>{
      const card = e.target.closest('[data-id]');
      if(!card || !pageEl.contains(card)) return;
      /* 若逐个绑定已生效（卡片自身带监听），委托这里就不重复处理 */
      if(card.dataset.directBound === '1') return;
      const c = state.clothes.find(x=>x.id===card.dataset.id);
      if(c && currentPage==='clothes') openClothDetailModal(c);
    });
  }
}

  `);
  /* 关键修复：表单内 #fStatus/#fCat 与页面筛选器 ID 重名，document 查询会命中页面上的筛选器，
     导致保存的衣服 category 变成 'all'（不属于任何分类，列表里消失）。所有查询限定在弹窗内。 */
  const q = sel => $(sel, modalContent);
  let newImg = data.image || '';
  q('#upFile').addEventListener('change', async e=>{
    const f = e.target.files[0];
    if(!f) return;
    newImg = await fileToBase64(f);
    if(newImg){
      q('#prevImg').src = newImg; q('#prevImg').style.display='block';
      q('#upIcon').style.display='none'; q('#phTxt').style.display='none';
      q('#upWrap').classList.add('has');
    } else {
      toast('图片读取失败，请换一张试试','err');
    }
  });
  q('#sSave').addEventListener('click', ()=>{
    const name = q('#fName').value.trim();
    if(!name){ toast('请填写名称','err'); return; }
    const payload = {
      id: (existing && existing.id) ? existing.id : uid(),
      name,
      size: q('#fSize').value.trim(),
      status: q('#fStatus').value,
      deposit: parseFloat(q('#fDeposit').value)||0,
      balance: parseFloat(q('#fBalance').value)||0,
      total: parseFloat(q('#fTotal').value)||0,
      category: q('#fCat').value,
      note: q('#fNote').value.trim(),
      image: newImg,
      paid: q('#fPaid').value==='1',
      createdAt: existing? existing.createdAt : Date.now()
    };
    if(isEdit){
      const i = state.clothes.findIndex(c=>c.id===existing.id);
      if(i>=0) state.clothes[i] = payload;
    } else {
      state.clothes.unshift(payload);
    }
    saveData(); closeModal(); renderPage(); toast(isEdit?'已保存修改':'已添加衣服');
  });
  if(isEdit){
    q('#delCloth').addEventListener('click', ()=>{
      confirmAction('删除衣服','确定删除这件衣服吗？此操作不可撤销。',()=>{
        state.clothes = state.clothes.filter(c=>c.id!==existing.id);
        saveData(); closeModal(); renderPage(); toast('已删除');
      });
    });
  }
  $$('[data-x]', modalContent).forEach(b => b.addEventListener('click', closeModal));
}

function bodyCardNew(b){
  const fieldHtml = BODY_FIELDS.map(f=>`

function renderCompareTable(){
  if(cmpSelected.size===0){
    return '<div class="compare-empty">请在上方勾选要对比的体子</div>';
  }
  const sel = state.bodies.filter(b=>cmpSelected.has(b.id));
  const cols = sel.map(b=>`<th>${esc(b.name)}</th>`).join('');
  let rows = '';
  for(const f of BODY_FIELDS){
    rows += `<tr><th>${f.n}</th>${sel.map(b=>`<td>${esc(b[f.k]||'-')}</td>`).join('')}</tr>`;
  }
  return `
    <table class="compare-table">
      <thead><tr><th>项目</th>${cols}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="font-size:11px;color:var(--c-text-3);text-align:center;margin-top:6px">点击表格可放大查看</div>
  `;
}

  $$('[data-add]', pageEl).forEach(el => el.addEventListener('click', ()=>{

  $('#bodySearch').addEventListener('input', e=>{

    $$('[data-body]', pageEl).forEach(el=>{

      el.style.display = (b.name.toLowerCase().includes(q)) ? '' : 'none';

  $('#cmpToggle').addEventListener('click', e=>{

            <tbody>${rows}</tbody>

        </div>
        <div class="modal-foot"><button class="btn btn-ghost" data-x>关闭</button></div>
      `);
      $$('[data-x]', modalContent).forEach(b => b.addEventListener('click', closeModal));

function renderWishItems(){
  const search = ($('#wishSearch')?.value || '').toLowerCase();
  const items = state.wishes.filter(w => !search || w.name.toLowerCase().includes(search));
  if(items.length===0) return '<div class="empty"><p>还没有想买的东西，点击「添加」记录一下吧~</p></div>';
  // group by date desc
  const groups = {};
  items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  for(const w of items){
    const k = w.date || '未排期';
    if(!groups[k]) groups[k] = [];
    groups[k].push(w);
  }
  let html = '';
  for(const date of Object.keys(groups)){
    if(date!=='未排期') html += `<div class="wish-day-head">▼ ${esc(date)}</div>`;
    for(const w of groups[date]){
      const parts = [];
      if(w.openTime) parts.push(`开售：${esc(w.openTime)}`);
      if(w.note) parts.push(esc(w.note));
      html += `
        <div class="wish-item-new" data-wish="${w.id}">
          <div class="wi-head">
            <span class="wi-dot"></span>
            <span class="wi-name">${esc(w.name)}</span>
            <span class="wi-price">${fmt(w.price||0)}</span>
          </div>
          ${parts.length?`<div class="wi-meta">${parts.join(' · ')}</div>`:''}
        </div>
      `;
    }
  }
  return html;
}
function renderCalDays(){
  const first = new Date(calYear, calMonth, 1);
  const days = new Date(calYear, calMonth+1, 0).getDate();
  const start = first.getDay();
  const tdy = new Date();
  const tdyKey = `${tdy.getFullYear()}-${tdy.getMonth()}-${tdy.getDate()}`;
  let html = '';
  for(let i=0;i<start;i++) html += '<div class="calendar-day muted"></div>';
  for(let d=1;d<=days;d++){
    const key = `${calYear}-${calMonth}-${d}`;
    const isTdy = key === tdyKey;
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = state.wishes.some(w=>w.date===ds);
    html += `<div class="calendar-day ${isTdy?'today':''} ${has?'has':''}" data-day="${d}">${d}</div>`;
  }
  return html;
}

    body = `<div class="nm">${esc(it.name)}</div><div class="meta">${esc(it.note||'')}</div><div class="pr">${fmt(it.price)}</div>`;

    body = `<div class="nm">${esc(it.name)}</div><div class="meta">${esc(it.note||'')}</div><div class="pr">${fmt(it.price)}</div>`;
  } else if(type==='client'){
    body = `<div class="nm">${esc(it.name)}</div><div class="meta">${esc(it.platform||'')} · ${esc(it.require||'')}</div><div class="pr">${fmt(it.price)}</div>`;
    ckHtml = `<div class="ck ${it.done?'on':''}" data-cdone="${key}_${it.id}" title="完成标记">${svgIcon('check',12)}</div>`;
  }
  let picInner = '';
  if(it.image){
    picInner = `<img src="${esc(it.image)}">`;
  } else {
    const icMap = {tool:'settings', stock:'list', income:'wallet', client:'mao'};
    picInner = `<div class="pic-icon">${svgIcon(icMap[type]||'mao',28)}</div>`;
  }
  return `
    <div class="mao-card ${it.done?'done':''}" data-edit="${key}_${it.id}">
      <div class="pic">${picInner}${ckHtml}</div>
      ${body}
      ${qtHtml}
    </div>
  `;
}

/* 毛娘模块：短键名 → state 数据键 映射 */
const MAO_KEY = {tools:'maoTools', stock:'maoStock', income:'maoIncome', clients:'maoClients'};
/* 解析 "key_id"（id 本身含下划线，不能用 split） */
function parseKV(str){
  const i = str.indexOf('_');
  return i<0 ? [str,''] : [str.slice(0,i), str.slice(i+1)];
}

function bindMao(){
  /* 点击标题栏（或箭头）切换 展开/收起 */
  $$('.mao-head').forEach(el => el.addEventListener('click', e=>{
    if(e.target.closest('[data-add]')) return; /* 「添加」按钮不触发折叠 */
    const key = el.dataset.toggle;
    if(!key) return;
    if(!state.maoCollapsed) state.maoCollapsed = {};
    state.maoCollapsed[key] = !state.maoCollapsed[key];
    saveData(); renderPage();
  }));
  $$('[data-add]').forEach(el => el.addEventListener('click', ()=>{
    openMaoModal(el.dataset.add);
  }));
  $$('[data-edit]').forEach(el => el.addEventListener('click', e=>{
    if(e.target.closest('[data-ssold],[data-sdec],[data-cdone]')) return;
    const [k, id] = parseKV(el.dataset.edit);
    openMaoModal(k, id);
  }));
  $$('[data-ssold]').forEach(el => el.addEventListener('click', e=>{
    e.stopPropagation();
    const [k, id] = parseKV(el.dataset.ssold);
    const arr = state[MAO_KEY[k]||k];
    const it = arr && arr.find(x=>x.id===id);
    if(!it) return;
    if((it.qty||0) <= 0){ toast('库存为 0，无法标记卖出','err'); return; }
    /* 清零前先记录该项金额，移除后仍计入库存合计 */
    const itemVal = it.total!=null ? Number(it.total||0) : Number(it.price||0)*Number(it.qty||0);
    it.qty = (it.qty||0) - 1;
    if((it.qty||0) <= 0){
      const idx = arr.indexOf(it);
      if(idx >= 0) arr.splice(idx, 1);
      state.maoStockCleared = Number(state.maoStockCleared||0) + itemVal;
      saveData(); renderPage(); toast('库存已清零，卡片已移除（金额保留在合计中）');
    } else {
      saveData(); renderPage(); toast('已扣减 1 件，库存合计金额不变');
    }
  }));
  $$('[data-sdec]').forEach(el => el.addEventListener('click', e=>{
    e.stopPropagation();
    const [k, id] = parseKV(el.dataset.sdec);
    const arr = state[MAO_KEY[k]||k];
    const it = arr && arr.find(x=>x.id===id);
    if(!it) return;
    if((it.qty||0) <= 0){ toast('库存已为 0','err'); return; }
    /* 清零前先记录该项金额，移除后仍计入库存合计 */
    const itemVal = it.total!=null ? Number(it.total||0) : Number(it.price||0)*Number(it.qty||0);
    it.qty = (it.qty||0) - 1;
    if((it.qty||0) <= 0){
      const idx = arr.indexOf(it);
      if(idx >= 0) arr.splice(idx, 1);
      state.maoStockCleared = Number(state.maoStockCleared||0) + itemVal;
      saveData(); renderPage(); toast('库存已清零，卡片已移除（金额保留在合计中）');
    } else {
      saveData(); renderPage(); toast('已扣减 1 件，库存合计金额不变');
    }
  }));
  $$('[data-cdone]').forEach(el => el.addEventListener('click', e=>{
    e.stopPropagation();
    const [k, id] = parseKV(el.dataset.cdone);
    const arr = state[MAO_KEY[k]||k];
    const it = arr && arr.find(x=>x.id===id);
    if(it){ it.done = !it.done; saveData(); renderPage(); }
  }));
}

    if(!f) return;
    newImg = await fileToBase64(f);
    if(newImg){
      $('#prevImg').src = newImg; $('#prevImg').style.display='block';
      $('#upIcon').style.display='none'; $('#phTxt').style.display='none';
      $('#upWrap').classList.add('has');
    } else {
      toast('图片读取失败，请换一张试试','err');
    }
  });
  $('#sSave').addEventListener('click', ()=>{
    const name = $('#fName').value.trim();
    if(!name){ toast('请填写名称','err'); return; }
    const payload = {
      id: existingId || uid(),
      name,
      image: newImg
    };
    if(key==='stock'){
      payload.shop = $('#fShop').value.trim();
      payload.price = parseFloat($('#fPrice').value)||0;
      payload.qty = parseInt($('#fQty').value)||0;
      /* 库存合计金额固定为录入时的购入总价，数量增减不改变 total */
      payload.total = (isEdit && data.total!=null) ? Number(data.total) : Number((payload.price||0)*(payload.qty||0));
      payload.note = $('#fNote').value.trim();
    } else if(key==='clients'){
      payload.platform = $('#fPlatform').value.trim();
      payload.require = $('#fRequire').value.trim();
      payload.price = parseFloat($('#fPrice').value)||0;
      payload.done = data.done || false;
    } else if(key==='income'){
      payload.price = parseFloat($('#fPrice').value)||0;
      payload.note = $('#fNote').value.trim();
    } else if(key==='tools'){
      payload.price = parseFloat($('#fPrice').value)||0;
      payload.note = $('#fNote').value.trim();
      payload.sold = data.sold || false;
    }
    if(isEdit){
      if(key==='stock' && (payload.qty||0) <= 0){
        /* 编辑后数量为 0：卡片移除，原金额保留在库存合计中 */
        const old = state[sk].find(x=>x.id===existingId);
        state.maoStockCleared = Number(state.maoStockCleared||0) + Number((old && old.total!=null) ? old.total : (payload.total||0));
        state[sk] = state[sk].filter(x=>x.id!==existingId);
        saveData(); closeModal(); renderPage(); toast('库存已清零，卡片已移除（金额保留在合计中）');
        return;
      }
      const i = state[sk].findIndex(x=>x.id===existingId);
      if(i>=0) state[sk][i] = payload;
    } else {
      if(key==='stock' && (payload.qty||0) <= 0){
        toast('数量为 0，未添加','err'); return;
      }
      state[sk].unshift(payload);
    }
    saveData(); closeModal(); renderPage(); toast(isEdit?'已保存':'已添加');
  });
  if(isEdit){
    $('#delItem').addEventListener('click', ()=>{
      confirmAction('删除条目','确认删除？',()=>{
        state[sk] = state[sk].filter(x=>x.id!==existingId);
        saveData(); closeModal(); renderPage(); toast('已删除');
      });
    });
  }
  $$('[data-x]', modalContent).forEach(b => b.addEventListener('click', closeModal));
}

function bindSettings(){
  /* 本地保存 */
  $('#manualSaveBtn').addEventListener('click', async ()=>{
    const btn = $('#manualSaveBtn');
    btn.disabled = true;
    btn.textContent = '正在保存…';
    const resultBox = $('#saveResultBox');
    try{
      await requestPersistentStorage();
      state._savedAt = Date.now();
      const json = JSON.stringify(state);
      /* 写入 IndexedDB（唯一存储层）并读回验证 */
      let idbWriteOk = false;
      try{
        await idbSet(IDB_DATA, json);
        await idbSet(IDB_AT, state._savedAt);
        const verify = await idbGet(IDB_DATA);
        idbWriteOk = (verify === json);
      }catch(e){ idbWriteOk = false; }
      updateLocalSaveLine();
      updateStorageUsage();
      /* 显示详细结果（云端为手动上传模式，这里不推送） */
      resultBox.style.display = 'block';
      const clothCount = (state.clothes||[]).length;
      const dataSize = (json.length/1024).toFixed(1);
      let html = '<b>保存结果报告</b><br>';
      html += '数据：' + clothCount + ' 件衣服 · ' + dataSize + ' KB<br>';
      html += 'IndexedDB 写入：' + (idbWriteOk ? '<span style="color:#3A6E58">✓ 成功（读回验证一致）</span>' : '<span style="color:var(--c-red)">✗ 失败</span>') + '<br>';
      html += '云端上传：手动模式，未上传（需要时点「上传到云端」）<br>';
      html += '保存时间：' + new Date().toLocaleString() + '<br>';
      if(idbWriteOk){
        html += '<span style="color:#3A6E58"><b>✓ 数据已安全保存到 IndexedDB</b>，容量充足不会丢失。</span>';
        resultBox.style.background = 'rgba(58,110,88,0.08)';
        resultBox.style.border = '1px solid rgba(58,110,88,0.2)';
        showSaveBadge(true, '💾 已保存');
      }else{
        html += '<span style="color:var(--c-red)"><b>⚠ IndexedDB 写入失败！</b>请检查浏览器设置（隐私/无痕模式可能禁用存储）。</span>';
        resultBox.style.background = 'rgba(232,90,111,0.08)';
        resultBox.style.border = '1px solid rgba(232,90,111,0.2)';
        showSaveBadge(false);
      }
      resultBox.innerHTML = html;
    }catch(e){
      resultBox.style.display = 'block';
      resultBox.style.background = 'rgba(232,90,111,0.08)';
      resultBox.style.border = '1px solid rgba(232,90,111,0.2)';

/* ==== 备份历史列表渲染 ==== */
async function renderBackupList(){
  const el = document.getElementById('backupList');
  if(!el) return;
  const list = await getBackupList();
  if(list.length === 0){
    el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--c-text-3);font-size:13px">暂无备份记录</div>';
    return;
  }
  const reasonText = {open:'打开时自动', periodic:'定时自动', exit:'退出时自动', manual:'手动创建'};
  el.innerHTML = list.slice(0, 10).map(bk=>{
    const d = new Date(bk.timestamp);
    const clothCount = (bk.data && bk.data.clothes) ? bk.data.clothes.length : 0;
    const bodyCount = (bk.data && bk.data.bodies) ? bk.data.bodies.length : 0;
    return `
      <div class="backup-item">
        <div class="bi-time">
          <div class="bi-date">${d.toLocaleDateString()} ${d.toLocaleTimeString()}</div>
          <div class="bi-sub">${reasonText[bk.reason]||bk.reason||'自动'} · ${clothCount}件衣服 · ${bodyCount}个体子 · ${formatBytes(bk.dataSize||0)}</div>
        </div>
        <div class="bi-actions">
          <button class="bi-btn dl" data-bk-dl="${bk.id}">下载</button>
          <button class="bi-btn" data-bk-rs="${bk.id}">恢复</button>
        </div>
      </div>
    `;
  }).join('');
  /* 绑定按钮 */
  el.querySelectorAll('[data-bk-dl]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const list = await getBackupList();
      const bk = list.find(b=>b.id === btn.dataset.bkDl);
      if(bk) downloadBackupFile(bk);
    });
  });
  el.querySelectorAll('[data-bk-rs]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      confirmAction('恢复备份','将用此备份数据<strong>覆盖当前所有数据</strong>，确认继续？', async ()=>{
        const ok = await restoreBackup(btn.dataset.bkRs);
        if(ok) toast('已从备份恢复');
        else toast('恢复失败','err');
      });
    });
  });
}

/* ==== CSV 导出（衣服数据，方便用 Excel/WPS 打开编辑） ==== */
function exportCSV(type){
  let csv = '', filename = '';
  if(type === 'clothes'){
    csv = '名称,分类,尺寸,状态,定金,尾款,总价,付款,备注\n';
    (state.clothes||[]).forEach(c=>{
      const cat = (state.categories||[]).find(x=>x.id===c.category);
      const row = [
        csvEscape(c.name), csvEscape(cat?cat.name:''), csvEscape(c.size),
        c.status==='shipped'?'已发货':'未发货',
        Number(c.deposit||0), Number(c.balance||0), Number(c.total||0),
        c.paid?'已付清':'未付清', csvEscape(c.note)
      ].join(',');
      csv += row + '\n';
    });
    filename = '衣服数据';
  }
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${filename}_${stamp}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出 CSV 文件');
}
function csvEscape(s){
  if(s==null) s='';
  s = String(s);
  if(s.indexOf(',')>=0 || s.indexOf('"')>=0 || s.indexOf('\n')>=0){
    return '"' + s.replace(/"/g,'""') + '"';
  }
  return s;
}

/* ==== CSV 导入（衣服数据，合并到现有数据） ==== */
function importCSV(text, type){
  try{
    const lines = text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length < 2){ toast('CSV 文件没有数据行','err'); return; }
    const headers = parseCSVLine(lines[0]);
    if(type === 'clothes'){
      let added = 0;
      for(let i=1; i<lines.length; i++){
        const cols = parseCSVLine(lines[i]);
        const name = cols[0] || '';
        if(!name) continue;
        const catName = cols[1] || '';
        const cat = (state.categories||[]).find(c=>c.name===catName) || state.categories[0];
        const status = cols[3] === '已发货' ? 'shipped' : 'not_shipped';
        state.clothes.push({
          id: uid(),
          name: name,
          category: cat ? cat.id : '',
          size: cols[2] || '',
          status: status,
          deposit: Number(cols[4]) || 0,
          balance: Number(cols[5]) || 0,
          total: Number(cols[6]) || 0,
          paid: cols[7] === '已付清',
          image: '',
          note: cols[8] || '',
          createdAt: Date.now()
        });
        added++;
      }
      saveData();
      renderPage();
      toast(`已导入 ${added} 条衣服数据`);
    }
  }catch(e){
    toast('CSV 解析失败：' + String(e.message||e),'err');
  }
}
function parseCSVLine(line){
  const result = [];
  let cur = '', inQuote = false;
  for(let i=0; i<line.length; i++){
    const ch = line[i];
    if(ch === '"'){
      if(inQuote && line[i+1] === '"'){ cur += '"'; i++; }
      else{ inQuote = !inQuote; }
    }else if(ch === ',' && !inQuote){
      result.push(cur); cur = '';
    }else{
      cur += ch;
    }
  }
  result.push(cur);
  return result;
}
